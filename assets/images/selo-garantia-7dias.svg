<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Gradiente Dourado Nobre Ultra Brilhante -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="20%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Gradiente Dourado Claro para Textos -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Fundo Azul Marinho Profundo -->
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142850" />
      <stop offset="65%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#040A14" />
    </radialGradient>

    <!-- Sombra Macia e Iluminação de Borda -->
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D97706" flood-opacity="0.4" />
    </filter>

    <!-- Caminhos de Arco Otimizados para Textos Grandes -->
    <!-- Arco Superior -->
    <path id="textArcTop" d="M 95,300 A 205,205 0 0,1 505,300" fill="none" />
    <!-- Arco Inferior -->
    <path id="textArcBottom" d="M 495,300 A 195,195 0 0,1 105,300" fill="none" />
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Raios Dourados Serrilhados Externos (24 Dentes Robustos) -->
    <g transform="translate(300,300)">
      <rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(0)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(15)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(30)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(45)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(60)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(75)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(90)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(105)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(120)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(135)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(150)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(165)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(180)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(195)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(210)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(225)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(240)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(255)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(270)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(285)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(300)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(315)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(330)" /><rect x="-16" y="-272" width="32" height="544" rx="8" fill="url(#goldGrad)" transform="rotate(345)" />
    </g>

    <!-- Anel Base Dourado -->
    <circle cx="300" cy="300" r="260" fill="url(#goldGrad)" />

    <!-- Anel Separador Azul Escuro -->
    <circle cx="300" cy="300" r="246" fill="#0A192F" />

    <!-- Disco Central Azul Marinho -->
    <circle cx="300" cy="300" r="240" fill="url(#navyBg)" />

    <!-- Filete de Brilho Dourado Interno -->
    <circle cx="300" cy="300" r="228" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 5" />
    <circle cx="300" cy="300" r="218" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.8" />

    <!-- ================================================================= -->
    <!-- TEXTO SUPERIOR EM ARCO: GARANTIA INCONDICIONAL (GRANDE & NÍTIDO)   -->
    <!-- ================================================================= -->
    <text font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="29" font-weight="900" fill="url(#goldText)" letter-spacing="3.5">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        ★ GARANTIA TOTAL ★
      </textPath>
    </text>

    <!-- ================================================================= -->
    <!-- BLOCO CENTRAL: 7 DIAS (HIPER DESTACADO)                            -->
    <!-- ================================================================= -->
    <g transform="translate(300, 280)">
      <!-- Fundo do Medalhão Central -->
      <circle cx="0" cy="0" r="115" fill="#0A192F" stroke="url(#goldGrad)" stroke-width="3.5" />
      <circle cx="0" cy="0" r="106" fill="#112240" />

      <!-- Tag 100% RISCO ZERO (Legível e Destaque) -->
      <rect x="-85" y="-90" width="170" height="28" rx="14" fill="url(#goldGrad)" />
      <text x="0" y="-71" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14" font-weight="900" fill="#0A192F" letter-spacing="1.5">
        100% RISCO ZERO
      </text>

      <!-- Número 7 Gigante em Ouro Sólido -->
      <text x="0" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="124" font-weight="900" fill="url(#goldGrad)" letter-spacing="-4">
        7
      </text>

      <!-- Palavra DIAS em Branco Puro -->
      <text x="0" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="7">
        DIAS
      </text>
    </g>

    <!-- ================================================================= -->
    <!-- FAIXA / BANNER INFERIOR: REEMBOLSO GARANTIDO (GRANDE E CLARO)      -->
    <!-- ================================================================= -->
    <g transform="translate(300, 448)">
      <!-- Pontas Traseiras do Laço -->
      <path d="M -230,18 L -250,0 L -230,-18 L -190,-18 L -190,18 Z" fill="#78350F" />
      <path d="M 230,18 L 250,0 L 230,-18 L 190,-18 L 190,18 Z" fill="#78350F" />

      <!-- Sombra da Dobra -->
      <path d="M -195,-22 L -195,24 L -180,18 L -180,-18 Z" fill="#451A03" />
      <path d="M 195,-22 L 195,24 L 180,18 L 180,-18 Z" fill="#451A03" />

      <!-- Placa Frontal da Faixa -->
      <path d="M -205,-24 L 205,-24 L 190,26 L -190,26 Z" fill="url(#goldGrad)" stroke="#FEF9C3" stroke-width="2" />
      
      <!-- Texto Principal da Faixa (Letras Grandes e Negrito) -->
      <text x="0" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="21" font-weight="900" fill="#0A192F" letter-spacing="2">
        SATISFAÇÃO OU REEMBOLSO
      </text>
    </g>

    <!-- ================================================================= -->
    <!-- TEXTO EM ARCO INFERIOR: AGORAEUFALO • PROF. LEONARDO LEITE        -->
    <!-- ================================================================= -->
    <text font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="800" fill="#FCD34D" letter-spacing="3.5">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        • PROJETO AGORAEUFALO •
      </textPath>
    </text>

    <!-- 5 Estrelas Douradas no Topo -->
    <g transform="translate(300, 138)">
      <g transform="translate(-60, 2)"><polygon points="0,-10 3,-3.8 9.5,-2.9 4.7,1.8 5.9,8.2 0,5.1 -5.9,8.2 -4.7,1.8 -9.5,-2.9 -3,-3.8" fill="url(#goldGrad)" /></g>
      <g transform="translate(-30, -3)"><polygon points="0,-12 3.6,-4.6 11.4,-3.5 5.7,2.1 7.1,9.8 0,6.1 -7.1,9.8 -5.7,2.1 -11.4,-3.5 -3.6,-4.6" fill="url(#goldGrad)" /></g>
      <g transform="translate(0, -6)"><polygon points="0,-14 4.2,-5.3 13.3,-4.1 6.7,2.5 8.3,11.5 0,7.2 -8.3,11.5 -6.7,2.5 -13.3,-4.1 -4.2,-5.3" fill="url(#goldGrad)" /></g>
      <g transform="translate(30, -3)"><polygon points="0,-12 3.6,-4.6 11.4,-3.5 5.7,2.1 7.1,9.8 0,6.1 -7.1,9.8 -5.7,2.1 -11.4,-3.5 -3.6,-4.6" fill="url(#goldGrad)" /></g>
      <g transform="translate(60, 2)"><polygon points="0,-10 3,-3.8 9.5,-2.9 4.7,1.8 5.9,8.2 0,5.1 -5.9,8.2 -4.7,1.8 -9.5,-2.9 -3,-3.8" fill="url(#goldGrad)" /></g>
    </g>

  </g>
</svg>