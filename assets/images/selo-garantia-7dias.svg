<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Gradiente Dourado Principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#C57E1E" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Gradiente Dourado Claro -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gradiente Fundo Azul Marinho Nobre -->
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#112240" />
      <stop offset="70%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#050C17" />
    </radialGradient>

    <!-- Sombra Elegante -->
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C57E1E" flood-opacity="0.3" />
    </filter>

    <!-- Caminho para o Texto Superior em Arco -->
    <path id="textArcTop" d="M 120,300 A 180,180 0 0,1 480,300" fill="none" />
    <!-- Caminho para o Texto Inferior em Arco -->
    <path id="textArcBottom" d="M 480,300 A 180,180 0 0,1 120,300" fill="none" />
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Engrenagem / Dentes do Selo Dourado Externo -->
    <g transform="translate(300,300)">
      <!-- 24 Raios / Dentes do Selo -->
      <rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(0)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(15)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(30)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(45)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(60)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(75)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(90)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(105)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(120)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(135)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(150)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(165)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(180)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(195)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(210)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(225)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(240)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(255)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(270)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(285)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(300)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(315)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(330)" opacity="0.95" /><rect x="-14" y="-270" width="28" height="540" rx="6" fill="url(#goldGrad)" transform="rotate(345)" opacity="0.95" />
    </g>

    <!-- Círculo Base Dourado -->
    <circle cx="300" cy="300" r="255" fill="url(#goldGrad)" />

    <!-- Círculo Borda Escura -->
    <circle cx="300" cy="300" r="242" fill="#0A192F" />

    <!-- Círculo Interno com Fundo Azul Marinho -->
    <circle cx="300" cy="300" r="236" fill="url(#navyBg)" />

    <!-- Borda Pontilhada / Textura Interna Dourada -->
    <circle cx="300" cy="300" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6 4" />
    <circle cx="300" cy="300" r="218" fill="none" stroke="url(#goldLight)" stroke-width="1.5" />

    <!-- Texto Curvo Superior: GARANTIA INCONDICIONAL -->
    <text font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="20" font-weight="900" fill="url(#goldLight)" letter-spacing="3.5">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        ★ GARANTIA INCONDICIONAL ★
      </textPath>
    </text>

    <!-- Centro do Selo: O NÚMERO 7 E DIAS -->
    <!-- Escudo / Brasão de Fundo no Centro -->
    <g transform="translate(300, 290)">
      <!-- Fundo Dourado Sutil -->
      <circle cx="0" cy="0" r="105" fill="#0A192F" stroke="url(#goldGrad)" stroke-width="3" />
      <circle cx="0" cy="0" r="98" fill="#112240" />

      <!-- Número 7 em Destaque -->
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="108" font-weight="900" fill="url(#goldGrad)" letter-spacing="-3">
        7
      </text>

      <!-- Palavra DIAS abaixo do 7 -->
      <text x="0" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="6">
        DIAS
      </text>

      <!-- 100% RISCO ZERO acima do 7 -->
      <text x="0" y="-56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="900" fill="#FBBF24" letter-spacing="2.5">
        100% RISCO ZERO
      </text>
    </g>

    <!-- Faixa / Ribbon Dourado na Parte Inferior -->
    <g transform="translate(300, 440)">
      <!-- Dobras Laterais da Faixa -->
      <path d="M -210,15 L -230,0 L -210,-15 L -170,-15 L -170,15 Z" fill="#78350F" />
      <path d="M 210,15 L 230,0 L 210,-15 L 170,-15 L 170,15 Z" fill="#78350F" />

      <!-- Faixa Central -->
      <path d="M -180,-20 L 180,-20 L 170,22 L -170,22 Z" fill="url(#goldGrad)" stroke="#FEF3C7" stroke-width="1.5" />
      
      <!-- Texto da Faixa -->
      <text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="17" font-weight="900" fill="#0A192F" letter-spacing="2">
        SATISFAÇÃO OU REEMBOLSO
      </text>
    </g>

    <!-- Texto Curvo Inferior: AGORAEUFALO -->
    <text font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="800" fill="#94A3B8" letter-spacing="3">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        • PROJETO 2026 • PROF. LEONARDO LEITE •
      </textPath>
    </text>

    <!-- 5 Estrelas Douradas no Topo -->
    <g transform="translate(300, 142) scale(0.9)">
      <g transform="translate(-50, 0)"><polygon points="0,-9 2.7,-3.5 8.7,-2.6 4.3,1.6 5.4,7.5 0,4.7 -5.4,7.5 -4.3,1.6 -8.7,-2.6 -2.7,-3.5" fill="url(#goldGrad)" /></g>
      <g transform="translate(-25, -4)"><polygon points="0,-10 3,-4 9.7,-2.9 4.8,1.8 6,8.3 0,5.2 -6,8.3 -4.8,1.8 -9.7,-2.9 -3,-4" fill="url(#goldGrad)" /></g>
      <g transform="translate(0, -6)"><polygon points="0,-12 3.6,-4.8 11.6,-3.5 5.8,2.2 7.2,10 0,6.2 -7.2,10 -5.8,2.2 -11.6,-3.5 -3.6,-4.8" fill="url(#goldGrad)" /></g>
      <g transform="translate(25, -4)"><polygon points="0,-10 3,-4 9.7,-2.9 4.8,1.8 6,8.3 0,5.2 -6,8.3 -4.8,1.8 -9.7,-2.9 -3,-4" fill="url(#goldGrad)" /></g>
      <g transform="translate(50, 0)"><polygon points="0,-9 2.7,-3.5 8.7,-2.6 4.3,1.6 5.4,7.5 0,4.7 -5.4,7.5 -4.3,1.6 -8.7,-2.6 -2.7,-3.5" fill="url(#goldGrad)" /></g>
    </g>

  </g>
</svg>