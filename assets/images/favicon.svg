<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Azul Marinho Nobre -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E223D" />
      <stop offset="60%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#050C17" />
    </linearGradient>

    <!-- Gradiente Dourado AgoraEuFalo -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Sombra suave para profundidade -->
    <filter id="popShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Sólida do Ícone (App Icon Canva Style) -->
  <rect width="512" height="512" rx="105" fill="url(#bgGradient)" />
  
  <!-- Borda Dourada Elegante -->
  <rect x="14" y="14" width="484" height="484" rx="95" fill="none" stroke="url(#goldGradient)" stroke-width="14" stroke-opacity="0.9" />

  <!-- Monograma AEF de Máxima Visibilidade (Ocupa 90% do espaço) -->
  <g filter="url(#popShadow)" font-family="system-ui, -apple-system, 'SF Pro Display', 'Plus Jakarta Sans', Montserrat, sans-serif" font-weight="900">
    <!-- A -->
    <text x="62" y="325" font-size="210" fill="#FFFFFF" letter-spacing="-4">A</text>
    
    <!-- E -->
    <text x="198" y="325" font-size="210" fill="#FFFFFF" letter-spacing="-4">E</text>
    
    <!-- F (Dourado de Destaque) -->
    <text x="328" y="325" font-size="210" fill="url(#goldGradient)" letter-spacing="-4">F</text>
    
    <!-- Ponto Final de Autoridade -->
    <circle cx="452" cy="308" r="20" fill="url(#goldGradient)" />
  </g>

  <!-- Barra de Fala / Onda Sonora de Ritmo (Treino de Ouvido) -->
  <g filter="url(#popShadow)">
    <rect x="75" y="372" width="56" height="24" rx="12" fill="#FFFFFF" opacity="0.95" />
    <rect x="145" y="364" width="56" height="40" rx="12" fill="#FFFFFF" opacity="0.95" />
    <rect x="215" y="356" width="56" height="56" rx="12" fill="url(#goldGradient)" />
    <rect x="285" y="364" width="56" height="40" rx="12" fill="url(#goldGradient)" />
    <rect x="355" y="372" width="75" height="24" rx="12" fill="url(#goldGradient)" />
  </g>
</svg>
