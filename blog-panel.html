<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50 text-slate-800">
<head>

<body class="min-h-full flex flex-col font-sans antialiased ambient-bg text-slate-800 selection:bg-amber-100 selection:text-amber-900">

  <!-- ========================================================================= -->
  <!-- TOPBAR COMPACTA & ELEGANTE                                                -->
  <!-- ========================================================================= -->

      <div class="flex items-center gap-3">
        <a href="blog/index.html" target="_blank" class="flex items-center gap-2 group" title="Ver Hub do Blog Público">
          <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center text-amber-400 font-extrabold text-sm shadow-xs">
            AEF
          </div>
          <div>
            <span class="font-extrabold text-sm text-slate-900 tracking-tight block">Biblioteca de Artigos</span>
            <span class="text-[10px] text-slate-400 block -mt-0.5">Gestão Editorial • AgoraEuFalo</span>
          </div>
        </a>
      </div>

      <!-- Quick Actions Header -->
      <div class="flex items-center gap-2.5">
        <a href="blog/index.html" target="_blank" class="px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold flex items-center gap-1.5 transition-all shadow-2xs">
          <i data-lucide="external-link" class="w-3.5 h-3.5 text-slate-500"></i>
          <span>Ver Blog Público</span>

        <button onclick="openImportModal()" class="px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold flex items-center gap-1.5 transition-all shadow-xs active:scale-95">
          <i data-lucide="plus" class="w-4 h-4 text-slate-950"></i>
          <span>Adicionar Artigo</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- CONTEÚDO PRINCIPAL: PAINEL DE GESTÃO & BIBLIOTECA                         -->
  <!-- ========================================================================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
    
    <!-- STATS CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

      <div class="p-4 sm:p-5 rounded-2xl bg-white border border-slate-200 shadow-2xs flex items-center justify-between">

          <h3 class="text-2xl sm:text-3xl font-extrabold text-slate-900" id="stat-total">0</h3>
        </div>

          <i data-lucide="folder" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- Card Publicados -->
      <div class="p-4 sm:p-5 rounded-2xl bg-emerald-50/70 border border-emerald-200 shadow-2xs flex items-center justify-between">
        <div class="space-y-1">
          <span class="text-[11px] font-extrabold text-emerald-800 uppercase tracking-wider">Publicados no Blog</span>
          <h3 class="text-2xl sm:text-3xl font-extrabold text-emerald-950" id="stat-published">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-xs">

          <h3 class="text-2xl sm:text-3xl font-extrabold text-amber-950" id="stat-drafts">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center shadow-xs">
          <i data-lucide="file-edit" class="w-5 h-5"></i>
        </div>
      </div>

    </div>

    <!-- FILTER & SEARCH BAR -->
    <div class="bg-white rounded-2xl border border-slate-200 p-3 sm:p-4 shadow-2xs flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <!-- Filter Tabs -->
      <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
        <button onclick="setFilter('all')" id="filter-btn-all" class="filter-tab active flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition-all bg-white text-slate-900 shadow-2xs">

        <button onclick="setFilter('published')" id="filter-btn-published" class="filter-tab flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900">
          Publicados (<span id="count-published">0</span>)

        <button onclick="setFilter('draft')" id="filter-btn-draft" class="filter-tab flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900">
          Rascunhos (<span id="count-draft">0</span>)
        </button>
      </div>

      <!-- Search Box -->
      <div class="relative w-full sm:w-72">

          id="search-input"

        >
      </div>

    </div>

    <!-- POSTS GRID -->
    <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Cards rendered dynamically via JavaScript -->
    </div>

    <!-- EMPTY STATE -->
    <div id="empty-state" class="hidden p-12 text-center bg-white rounded-2xl border border-slate-200 space-y-3">
      <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto">
        <i data-lucide="inbox" class="w-6 h-6"></i>
      </div>
      <h4 class="text-sm font-bold text-slate-900">Nenhum artigo encontrado</h4>
      <p class="text-xs text-slate-500 max-w-sm mx-auto">Não encontramos nenhum artigo com os filtros selecionados. Clique em "Adicionar Artigo" para importar um novo post.</p>
    </div>

  </main>

  <!-- ========================================================================= -->
  <!-- MODAL: PREVIEW DO ARTIGO                                                  -->
  <!-- ========================================================================= -->
  <div id="preview-modal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs hidden items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden my-auto">
      
      <!-- Modal Header -->
      <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <span id="modal-preview-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-emerald-100 text-emerald-800 border border-emerald-200">Publicado</span>
          <span class="text-xs text-slate-400 font-mono" id="modal-preview-slug">post.html</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="copyModalPostHtml()" class="px-3 py-1 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold flex items-center gap-1 transition-all shadow-2xs">
            <i data-lucide="copy" class="w-3.5 h-3.5 text-slate-500"></i> Copiar HTML do Corpo
          </button>
          <button onclick="closePreviewModal()" class="w-8 h-8 rounded-lg hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition-colors">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Modal Body (Clean Article Paper) -->
      <div class="flex-1 overflow-y-auto p-6 sm:p-10 space-y-6">
        
        <!-- Category & Read Time -->
        <div class="flex items-center gap-2 text-xs">
          <span id="modal-preview-category" class="font-extrabold text-amber-700 uppercase tracking-wide">Magic Stories</span>
          <span class="text-slate-300">•</span>
          <span id="modal-preview-date" class="text-slate-500">Data</span>
          <span class="text-slate-300">•</span>
          <span id="modal-preview-readtime" class="text-slate-500">6 min de leitura</span>
        </div>

        <!-- Title & Subtitle -->
        <h1 id="modal-preview-title" class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-tight">Título do Artigo</h1>
        <p id="modal-preview-subtitle" class="text-sm sm:text-base text-slate-600 leading-relaxed">Subtítulo do artigo</p>

        <!-- Media Cover / Video -->
        <div id="modal-preview-media" class="rounded-2xl overflow-hidden aspect-video bg-slate-900 relative shadow-md">
          <!-- Video or Image -->
        </div>

        <!-- Takeaways Box -->
        <div id="modal-preview-takeaways" class="p-4 sm:p-5 rounded-2xl bg-amber-50/80 border border-amber-200/80 space-y-2">
          <h4 class="text-xs font-extrabold uppercase tracking-wide text-amber-900 flex items-center gap-1.5">
            <i data-lucide="check-circle-2" class="w-4 h-4 text-amber-700"></i> Destaques Pedagógicos Deste Artigo:
          </h4>
          <ul id="modal-preview-takeaways-list" class="text-xs sm:text-sm text-amber-950 space-y-2 pl-4 list-disc leading-relaxed"></ul>
        </div>

        <!-- Article Body -->
        <div id="modal-preview-body" class="prose-preview text-slate-700 text-sm sm:text-base leading-relaxed space-y-4"></div>

        <!-- Golden Tip -->
        <div id="modal-preview-golden-tip-box" class="p-4 sm:p-5 rounded-2xl bg-amber-50/90 border-l-4 border-amber-500 space-y-1.5">
          <div class="flex items-center gap-1.5 text-amber-900 font-extrabold text-xs">
            <i data-lucide="lightbulb" class="w-4 h-4 text-amber-600"></i>
            <span>A Sacada de Ouro do Professor Leo:</span>
          </div>
          <p id="modal-preview-golden-tip" class="text-xs sm:text-sm text-amber-950 leading-relaxed italic"></p>
        </div>

      </div>

    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- MODAL: ADICIONAR / IMPORTAR ARTIGO                                        -->
  <!-- ========================================================================= -->
  <div id="import-modal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs hidden items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-2xl w-full p-6 sm:p-8 space-y-5 my-auto">
      
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h3 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-amber-600"></i> Adicionar / Editar Artigo
          </h3>
          <p class="text-xs text-slate-400">Cadastre um novo artigo ou cole os dados gerados pela IA no chat.</p>
        </div>
        <button onclick="closeImportModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form onsubmit="handleSaveArticle(event)" class="space-y-4 text-xs">
        
        <input type="hidden" id="edit-post-id" value="">

        <div>
          <label class="block font-bold text-slate-700 mb-1">Título do Artigo: *</label>
          <input type="text" id="import-title" required placeholder="Ex: Magic Story 01: A História da Grazi..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Subtítulo: *</label>
          <textarea id="import-subtitle" rows="2" required placeholder="Subtítulo explicativo e cativante..." class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Categoria: *</label>
            <select id="import-category" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-amber-500">
              <option value="Magic Stories">Magic Stories</option>
              <option value="Connected Speech">Connected Speech</option>
              <option value="Fluência & Reflexo">Fluência & Reflexo</option>
              <option value="Treino Auditivo">Treino Auditivo</option>
              <option value="Dúvidas dos Alunos">Dúvidas dos Alunos</option>
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">Slug do Artigo: *</label>
            <input type="text" id="import-slug" required placeholder="magic-story-01-historia-da-grazi" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-mono text-xs focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Link do Vídeo no YouTube (Opcional):</label>
            <input type="url" id="import-youtube-url" placeholder="https://www.youtube.com/watch?v=..." class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-xs focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Status Inicial:</label>
            <select id="import-status" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-bold focus:outline-none focus:border-amber-500">
              <option value="draft">🟡 Rascunho</option>
              <option value="published">🟢 Publicado</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Corpo do Artigo em HTML (Conteúdo Completo): *</label>
          <textarea id="import-body-html" rows="6" required placeholder="<h2>1. Título da Seção</h2><p>Texto...</p>" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-mono text-[11px] focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">A Sacada de Ouro do Professor Leo:</label>
          <input type="text" id="import-golden-tip" placeholder="Frase final marcante do Professor Leo..." class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-amber-500">
        </div>

        <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeImportModal()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-bold transition-colors">
            Cancelar
          </button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold shadow-xs transition-all">
            Salvar Artigo na Biblioteca
          </button>
        </div>

      </form>

    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- MODAL: SNIPPET DE PUBLICAÇÃO                                              -->
  <!-- ========================================================================= -->
  <div id="publish-modal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs hidden items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-xl w-full p-6 sm:p-8 space-y-4 my-auto">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center">
            <i data-lucide="check" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="text-sm font-extrabold text-slate-900">Artigo Pronto para o Feed!</h3>
            <p class="text-[11px] text-slate-400">Snippet gerado para o arquivo <code class="font-mono text-emerald-700">blog/index.html</code></p>
          </div>
        </div>
        <button onclick="closePublishModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <p class="text-xs text-slate-600">Copie o snippet do card abaixo e cole dentro da grade de artigos do seu <code class="bg-slate-100 px-1 py-0.5 rounded font-mono">blog/index.html</code>:</p>
      
      <pre class="p-3.5 bg-slate-900 rounded-xl overflow-x-auto text-[10px] font-mono text-emerald-400 max-h-48 border border-slate-800"><code id="publish-feed-code"></code></pre>

      <div class="flex items-center justify-between pt-2">
        <button onclick="copyPublishSnippet()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-xs">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copiar Snippet do Feed
        </button>
        <button onclick="closePublishModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
          Fechar
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl border border-slate-700 text-xs font-semibold flex items-center gap-2 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400" id="toast-icon"></i>
    <span id="toast-message">Notificação</span>
  </div>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT: GESTÃO COMPACTA DA BIBLIOTECA                                 -->
  <!-- ========================================================================= -->
  <script>
    let currentFilter = 'all';
    let currentModalPost = null;

    // SEED INICIAL COM O TEXTO INTEGRAL DOS ARTIGOS (VALIDADO)
    const INITIAL_LIBRARY = [{"id":"post-tom-02","title":"Magic Story 02: O Melhor Jeito de Treinar Inglês e o Segredo do Present Perfect Sem Regras Chatas","subtitle":"Como a história do Tom — o marido workaholic da Grazi — ensina a falar estruturas como \"They've been married for 18 years\" e \"How long have you been an engineer?\" no reflexo imediato.","category":"Magic Stories","status":"published","readTime":"8 min de leitura","date":"22 de Agosto de 2026","slug":"magic-story-02-historia-do-tom-present-perfect","youtubeUrl":"https://www.youtube.com/watch?v=umjf4UyqgR4","youtubeId":"umjf4UyqgR4","imageUrl":"https://img.youtube.com/vi/umjf4UyqgR4/maxresdefault.jpg","keyTakeaways":["O Personagem do Tom: Um administrador de empresas de 50 anos de Cleveland, Ohio, que é CEO de uma multinacional farmacêutica em Brasília.","O Drama do Workaholic: Um cara super legal e easy-going que tenta ser o melhor pai do mundo, mas viaja todo mês para os EUA e quase não vê as filhas.","A Estrutura de Ouro (\"Have Been for...\"): Desmistificando o Present Perfect através de frases da vida real (\"They've been married for 18 years\" / \"I've been a teacher for 30 years\").","Treino Completo de Ativação Oral: A dinâmica prática de Listen & Read, Vocabulary, Listen & Answer, Look & Retell e Listen & Ask."],"bodyHtml":"<h2>1. Por Que a Repetição da Experiência é o Único Caminho Para a Fluência</h2>\n        <p>\n          Se você não domina o idioma inglês, você não sabe como o cérebro adulto adquire uma nova língua. A maioria das pessoas passa anos presa em cursos tradicionais tentando decorar tabelas de gramática e listas de vocabulário solto. Quando você aprende uma regra nova hoje no papel, amanhã você inevitavelmente a esquece.\n        </p>\n        <p>\n          O <strong>Método Magic Stories</strong> funciona exatamente no sentido oposto: você entra dentro de um universo narrativo. Tudo aquilo que acontece na vida dos personagens — como na história da Grazi e agora na história do Tom — serve como âncora de referência para você transferir essas mesmas frases para o seu dia a dia.\n        </p>\n        <p>\n          Você não vai passar pela <strong>Magic Story #02</strong> apenas uma vez. Você volta a ela de novo, de novo e de novo (<em>over and over and over</em>). Quanto mais você repete a experiência auditiva, mais o seu córtex decodifica a melodia do inglês e mais rápida se torna a sua resposta na hora de falar.\n        </p>\n\n        <blockquote>\n          \"Não adianta você fazer uma lista mental de regras gramaticais na sua cabeça. O seu cérebro precisa ser gatilhado pela história para formular a frase ou a pergunta no reflexo puro, sem passar pela tradução do português.\"\n        </blockquote>\n\n        <h2>2. A História do Tom (Tom, The Workaholic Executive)</h2>\n        <p>\n          Na Magic Story anterior, descobrimos que a Graziela tem uma casa linda no Lago em Brasília, duas filhas maravilhosas (Anna e Flávia), mas quer mudar de vida. A <strong>Magic Story #02</strong> nos apresenta o marido dela, Tom, e nos ajuda a entender as dinâmicas dessa família:\n        </p>\n        \n        <div class=\"my-6 p-6 rounded-2xl bg-amber-50/70 border-2 border-amber-200/90 space-y-3 shadow-2xs\">\n          <h4 class=\"text-xs font-black uppercase tracking-wide text-amber-900 flex items-center gap-1.5\">\n            <i data-lucide=\"file-text\" class=\"w-4 h-4 text-amber-700\"></i> O Texto Integral da História do Tom:\n          </h4>\n          <p class=\"font-mono text-sm sm:text-base text-slate-800 leading-relaxed italic bg-white p-5 rounded-xl border border-slate-200\">\n            \"Graziella is married to Tom. Tom is a 50-year-old business administrator from Cleveland, Ohio. He is the Chief Executive Officer (CEO) of a multinational pharmaceutical company based in Brasília. Tom is a great guy, very friendly and very easy-going, but Tom is a workaholic. He works many hours a week and sometimes on weekends. Grazi and Tom have been married for 18 years. Yes. And they both of course speak Portuguese and English. He travels a lot. He has to fly to the USA and stay there for about a week every single month. He is a very important executive for the company with a lot of responsibilities. Tom loves his daughters and truly he tries to be the best father he can be. But he doesn't get to see them very often. He is always very busy. What does Grazi think of that?\"\n          </p>\n        </div>\n\n        <p>\n          O Tom é um cara espetacular, muito amigável (<em>friendly</em>) e tranquilo (<em>easy-going</em>), mas ele é um <strong>workaholic</strong> (trabalhólatra). Ele trabalha tantas horas por semana e nos fins de semana que praticamente não consegue acompanhar o crescimento das filhas. E fica a pergunta no ar: <em>What does Grazi think of that?</em> (O que a Grazi acha disso tudo?).\n        </p>\n\n        <h2>3. Atividade 1: Listen & Read (Conectando o Som Real à Escrita)</h2>\n        <p>\n          No <strong>Listen & Read</strong>, o foco não é testar se você entendeu a história — porque a história você já entendeu quando explicamos o contexto. O objetivo fundamental é <strong>acostumar o seu ouvido com o som real das palavras</strong>.\n        </p>\n        <p>\n          No português, nós lemos quase exatamente como escrevemos. No inglês é o oposto: na maioria das vezes, o som produzido na fala viva tem conexões sonoras muito diferentes da grafia no papel. \n        </p>\n        <p>\n          Por exemplo, ao ler <em>\"multinational pharmaceutical company\"</em>, visualmente você reconhece que se trata de uma indústria farmacêutica. Mas quando um americano fala em ritmo nativo (<em>/fɑːrməˈsuːtɪkl/</em>), se você nunca tiver treinado o ouvido com a sincronização áudio-texto, o som se perde. No Listen & Read, você sincroniza a música da língua ao seu cérebro.\n        </p>\n\n        <h2>4. A Estrutura de Ouro: Dominando \"They Have Been Married\" Sem Regras de Livro</h2>\n        <p>\n          Dentro de toda Magic Story existe uma <strong>frase âncora</strong> que condensa estruturas poderosas da língua inglesa. Nesta aula, a frase central é:\n        </p>\n\n        <div class=\"my-6 p-6 rounded-2xl bg-amber-50/80 border-2 border-amber-200 shadow-2xs space-y-3\">\n          <div class=\"flex items-center gap-2 text-amber-900 font-extrabold text-sm uppercase\">\n            <i data-lucide=\"zap\" class=\"w-4 h-4 text-amber-700\"></i> A Sacada do Present Perfect na Prática:\n          </div>\n          <p class=\"font-mono text-base font-bold text-amber-950 bg-white p-4 rounded-xl border border-slate-200\">\n            \"Grazi and Tom have been married for 18 years.\"\n          </p>\n          <p class=\"text-xs sm:text-sm text-amber-950/90 leading-relaxed\">\n            Em português, dizemos no presente: <em>\"A Grazi e o Tom são casados há 18 anos\"</em> ou <em>\"Eu sou professor há 30 anos\"</em>. Em inglês, quando uma ação começou no passado e continua verdadeira até hoje, <strong>você não usa \"are married\" nem \"I am teacher\"</strong>. Você usa a estrutura <strong>\"have been... for\"</strong>:\n          </p>\n          <ul class=\"text-xs sm:text-sm text-slate-800 space-y-1.5 pl-4 list-disc font-medium\">\n            <li><em>\"They've been married for 18 years.\"</em> (Eles são casados há 18 anos).</li>\n            <li><em>\"How long have they been married?\"</em> (Há quanto tempo eles são casados?).</li>\n            <li><em>\"I've been a teacher for 30 years.\"</em> (Eu sou professor há 30 anos).</li>\n            <li><em>\"I'm an engineer. How long have you been an engineer?\"</em> (Eu sou engenheiro. Há quanto tempo você é engenheiro?).</li>\n          </ul>\n        </div>\n\n        <p>\n          Você não precisa ficar pensando se isso se chama <em>Present Perfect Continuous</em> ou decorando tabelas de particípio irregular. Quando você vivencia a frase dentro da história do Tom e repete nas atividades orais, a estrutura <strong>\"I've been / They've been\"</strong> sai no piloto automático da sua boca.\n        </p>\n\n        <h2>5. Atividade 2: Vocabulary Practice (Dissecação dos Chunks)</h2>\n        <p>\n          Vejamos outros blocos de vocabulário e expressões essenciais desta história:\n        </p>\n        \n        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4 my-6\">\n          <div class=\"p-4 rounded-xl bg-white border border-slate-200 shadow-2xs space-y-1\">\n            <span class=\"font-bold text-slate-900 text-sm block\">📌 \"A 50-year-old business administrator\"</span>\n            <p class=\"text-xs text-slate-600\">Três informações em uma só frase: idade (50), profissão (administrador de empresas) e origem (Cleveland, Ohio).</p>\n          </div>\n          <div class=\"p-4 rounded-xl bg-white border border-slate-200 shadow-2xs space-y-1\">\n            <span class=\"font-bold text-slate-900 text-sm block\">📌 \"Easy-going vs. Outgoing\"</span>\n            <p class=\"text-xs text-slate-600\">A Grazi é <em>outgoing</em> (extrovertida, expansiva). O Tom é <em>easy-going</em> (calmo, tranquilo, flexível, boa praça).</p>\n          </div>\n          <div class=\"p-4 rounded-xl bg-white border border-slate-200 shadow-2xs space-y-1\">\n            <span class=\"font-bold text-slate-900 text-sm block\">📌 \"Fly to the USA vs. Drive to work\"</span>\n            <p class=\"text-xs text-slate-600\">Se você vai a pé: <em>walk</em>. Se vai de carro: <em>drive</em>. Se vai de avião: <em>fly</em>. O Tom <em>flies to the USA every month</em>.</p>\n          </div>\n          <div class=\"p-4 rounded-xl bg-white border border-slate-200 shadow-2xs space-y-1\">\n            <span class=\"font-bold text-slate-900 text-sm block\">📌 \"Doesn't get to see them very often\"</span>\n            <p class=\"text-xs text-slate-600\">A expressão <em>get to see</em> indica \"ter a oportunidade ou chance de ver\". Como ele é workaholic, ele não tem essa chance frequentemente.</p>\n          </div>\n        </div>\n\n        <h2>6. Atividade 3: Listen & Answer (Treino de Resposta Imediata)</h2>\n        <p>\n          No <strong>Listen & Answer</strong>, o Professor Leo faz perguntas diretas em inglês e você responde em voz alta em menos de 2 segundos, sem pensar em português:\n        </p>\n        <ul class=\"space-y-2.5 my-4 pl-4 list-disc text-slate-700 text-sm sm:text-base\">\n          <li><strong>Who is Grazi married to?</strong> &rarr; <em>\"Tom!\"</em> (Abre a boca e fale a primeira palavra que vier!).</li>\n          <li><strong>What does Tom do?</strong> &rarr; <em>\"He is the CEO of a multinational pharmaceutical company.\"</em></li>\n          <li><strong>What is Tom like?</strong> &rarr; <em>\"He is a great guy, very friendly and easy-going, but he is a workaholic.\"</em></li>\n          <li><strong>How long have Tom and Grazi been married?</strong> &rarr; <em>\"18 years! They've been married for 18 years.\"</em></li>\n          <li><strong>How often does he travel to the USA?</strong> &rarr; <em>\"Every single month! He stays there for about a week.\"</em></li>\n          <li><strong>Does Tom get to see his daughters all the time?</strong> &rarr; <em>\"No, he doesn't get to see them very often because he is always very busy.\"</em></li>\n        </ul>\n\n        <h2>7. Look & Retell e Listen & Ask (O Treino de Fazer Perguntas)</h2>\n        <p>\n          Para solidificar a fala ativa, o treino avança em dois exercícios fundamentais:\n        </p>\n        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4 my-6\">\n          <div class=\"p-5 rounded-2xl bg-amber-50/80 border border-amber-200 shadow-2xs space-y-2\">\n            <span class=\"text-amber-900 font-extrabold uppercase text-xs block\">🗣️ Look & Retell (Watch & Retell)</span>\n            <p class=\"text-xs sm:text-sm text-amber-950/90 leading-relaxed\">\n              Você pausa o áudio, assiste à animação do Tom no vídeo e reconta a história com o seu inglês atual. Pode ser em frases curtas (<em>\"Tom is 50. He is from Cleveland. He is the CEO.\"</em>) ou elaboradas. O segredo é improvisar sem medo de errar.\n            </p>\n          </div>\n          <div class=\"p-5 rounded-2xl bg-amber-50/80 border border-amber-200 shadow-2xs space-y-2\">\n            <span class=\"text-amber-900 font-extrabold uppercase text-xs block\">❓ Listen & Ask (Inversão de Papéis)</span>\n            <p class=\"text-xs sm:text-sm text-amber-950/90 leading-relaxed\">\n              O professor dá uma afirmação negativa para você formular a pergunta correta na hora:\n              <br>&bull; <em>\"Grazi is not married to a lawyer!\"</em> &rarr; <strong>Who is Grazi married to?</strong>\n              <br>&bull; <em>\"Tom is not 45 years old!\"</em> &rarr; <strong>How old is Tom?</strong>\n              <br>&bull; <em>\"Tom is not a teacher!\"</em> &rarr; <strong>What does Tom do?</strong>\n            </p>\n          </div>\n        </div>\n\n        <h2>8. Pronunciation Practice: Construção Fonética de Trás para Frente</h2>\n        <p>\n          Na etapa final, moldamos a musculatura da boca com repetição encadeada de trás para frente:\n        </p>\n\n        <!-- Box Claro e de Alto Contraste da Seção de Pronúncia -->\n        <div class=\"my-6 p-5 sm:p-6 rounded-2xl bg-amber-50/80 border-2 border-amber-200/90 shadow-2xs space-y-3\">\n          <span class=\"text-amber-900 font-black uppercase text-xs tracking-wider flex items-center gap-1.5\">\n            <i data-lucide=\"music\" class=\"w-4 h-4 text-amber-700\"></i> Encadeamento Fonético em Blocos Musicais:\n          </span>\n          <div class=\"font-mono text-xs sm:text-sm text-slate-900 space-y-1.5 bg-white p-4 rounded-xl border border-slate-200\">\n            <p class=\"text-slate-600\">&bull; <em>\"...based in Brasília.\"</em></p>\n            <p class=\"text-slate-700\">&bull; <em>\"...company based in Brasília.\"</em></p>\n            <p class=\"text-slate-800\">&bull; <em>\"...pharmaceutical company based in Brasília.\"</em></p>\n            <p class=\"text-slate-900 font-semibold\">&bull; <em>\"...multinational pharmaceutical company based in Brasília.\"</em></p>\n            <p class=\"text-amber-950 font-black pt-1.5 border-t border-slate-100\">&bull; <em>\"He is the Chief Executive Officer of a multinational pharmaceutical company based in Brasília.\"</em></p>\n          </div>\n        </div>\n\n        <p>\n          Quando você treina desse jeito por 5 a 6 dias seguidos com a mesma história, a trava do cérebro desaparece e o inglês flui com a mesma naturalidade do português.\n        </p>","goldenTip":"Você não aprende Present Perfect decorando tabela de particípio no caderno. Você aprende vivenciando frases como \"They've been married for 18 years\" até o som virar natural no seu ouvido e você responder \"I've been an engineer for 10 years\" sem precisar parar para conjugar."},{"id":"post-grazi-01","title":"Magic Story 01: A História da Grazi e o Passo a Passo Para Destravar o Inglês no Reflexo","subtitle":"Como uma história real de 1 minuto em Brasília — com Listen & Read, Vocabulário, Listen & Answer, Look & Retell e Listen & Ask — condiciona o cérebro a falar sem tradução mental.","category":"Magic Stories","status":"published","readTime":"7 min de leitura","date":"22 de Agosto de 2026","slug":"magic-story-01-historia-da-grazi-treino-reflexo","youtubeUrl":"https://www.youtube.com/watch?v=pQryEQO-FhA","youtubeId":"pQryEQO-FhA","imageUrl":"https://img.youtube.com/vi/pQryEQO-FhA/maxresdefault.jpg","keyTakeaways":["O Paradoxo da Vida da Grazi: Uma advogada do governo federal de 45 anos que mora no Lago em Brasília, ama as filhas, mas quer mudar de vida.","Listen & Read vs. Leitura Passiva: Por que você deve sincronizar som e texto sem parar no dicionário para destravar o reconhecimento auditivo.","Vocabulário e Chunks em Contexto Real: A análise fonética e estrutural de \"a 45-year-old woman\", \"federal government\", \"waterfront\", \"outgoing vs. shy\" e \"stand out\".","O Treino Completo de Ativação Oral: A dinâmica prática de Listen & Answer, Look & Retell e o desafio de formular perguntas com Listen & Ask."],"bodyHtml":"<h2>1. O Segredo das Magic Stories: Repetir a Experiência vs. Repetir Feito Papagaio</h2>\n        <p>\n          Depois de <strong>mais de 35 anos utilizando o idioma inglês diariamente e mais de 30 anos lecionando</strong>, eu tomei uma decisão: mostrar a verdade sobre como o cérebro humano adquire fluência. Inglês não é matéria de escola para você ficar decorando regras no papel para passar em prova; inglês é uma experiência viva.\n        </p>\n        <p>\n          O inglês da vida real não escolhe quem está ouvindo. Quando um nativo fala na rua, no aeroporto ou em uma reunião, ele não pergunta se você é iniciante, intermediário ou avançado. O que muda é a sua <strong>experiência com o conteúdo</strong>. E para atingir um nível excelente de escuta e fala, o segredo é a repetição intencional da mesma história.\n        </p>\n        <p>\n          Não é repetir palavras soltas feito um papagaio sem entender nada. É <strong>repetir a experiência</strong> — exatamente como quando você assiste várias vezes ao seu filme predileto ou escuta a sua música favorita. Quanto mais vezes você se expõe à mesma história, às mesmas frases e à mesma melodia, mais o seu ouvido decodifica os padrões sonoros, até que a fala surja como consequência direta do que você escutou.\n        </p>\n\n        <blockquote>\n          \"Tudo de novo que você aprende hoje sobre inglês, você vai esquecer. A partir do momento em que você aceita isso, a sua vida muda e você fica livre: você entende que precisa revisitar e vivenciar a mesma história de novo, de novo e de novo até virar reflexo.\"\n        </blockquote>\n\n        <h2>2. A História da Grazi (Graziella Wants to Change Her Life)</h2>\n        <p>\n          Toda Magic Story começa pelo contexto: não adianta ouvir uma história sem saber previamente do que ela se trata. A <strong>Magic Story #01</strong> apresenta a vida de Graziela:\n        </p>\n        \n        <div class=\"my-6 p-6 rounded-2xl bg-amber-50/70 border-2 border-amber-200/90 space-y-3 shadow-2xs\">\n          <h4 class=\"text-xs font-black uppercase tracking-wide text-amber-900 flex items-center gap-1.5\">\n            <i data-lucide=\"file-text\" class=\"w-4 h-4 text-amber-700\"></i> O Texto Integral da História da Grazi:\n          </h4>\n          <p class=\"font-mono text-sm sm:text-base text-slate-800 leading-relaxed italic bg-white p-5 rounded-xl border border-slate-200\">\n            \"Graziella is a 45-year-old woman who wants to change her life. She lives in Brasília, the capital of Brazil, with her husband and two kids. She's a lawyer and she works for the federal government. She lives in a big house near the lake with a beautiful view to the waterfront. She's a very friendly and outgoing person. She loves talking to people although she sees herself as a very shy woman. Grazi doesn't like to stand out and she gets embarrassed very easily. Grazi loves outdoor activities like biking, hiking, swimming and taking walks with her daughters Anna and Flavia. Grazi is crazy about her daughters. Every day she gets up early about 7:00, goes running in the park for about 50 minutes. Then she gets back home, jumps in the pool, takes a shower, has some breakfast, and goes to work at 9:00. She works until 5:00 PM. In the evening, she sits in the backyard, puts her headphones on, and listens to English lessons on her iPad. The question, my friend, is: why does Grazi want to change her life?\"\n          </p>\n        </div>\n\n        <p>\n          A história traz um paradoxo humano real: a Grazi tem uma vida estruturada — mora numa casa linda no Lago em Brasília, é advogada concursada do governo federal, é mãe dedicada da Anna e da Flavia —, mas ela não está feliz e quer mudar de vida. É essa conexão emocional que ancora o aprendizado.\n        </p>\n\n        <h2>3. Atividade 1: Listen & Read (Escutar e Acompanhar)</h2>\n        <p>\n          O primeiro passo do treinamento é o <strong>Listen & Read</strong>. O erro clássico de quem estuda com legenda é deixar os olhos dominarem enquanto o ouvido se desliga e transforma a fala em ruído.\n        </p>\n        <p>\n          Na Magic Story, o objetivo é ler e escutar simultaneamente para <strong>conectar o som real à palavra escrita</strong>. Palavras como <em>\"federal government\"</em> parecem idênticas ao português no papel, mas têm uma acentuação e cadência totalmente diferentes na pronúncia real. Você não para a leitura para caçar palavras no dicionário; você mantém o fluxo para absorver a música da frase.\n        </p>\n\n        <h2>4. Atividade 2: Vocabulary Practice (Dissecação dos Chunks da Aula)</h2>\n        <p>\n          No segundo momento, analisamos as estruturas e expressões da história em contexto:\n        </p>\n        \n        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4 my-6\">\n          <div class=\"p-4 rounded-xl bg-white border border-slate-200 shadow-2xs space-y-1\">\n            <span class=\"font-bold text-slate-900 text-sm block\">📌 \"A 45-year-old woman\"</span>\n            <p class=\"text-xs text-slate-600\">Quando a idade funciona como adjetivo antes do substantivo, ela fica no singular: <em>a 45-year-old woman, a 2-year-old baby, a thousand-dollar car</em>.</p>\n          </div>\n          <div class=\"p-4 rounded-xl bg-white border border-slate-200 shadow-2xs space-y-1\">\n            <span class=\"font-bold text-slate-900 text-sm block\">📌 \"Waterfront & Near the Lake\"</span>\n            <p class=\"text-xs text-slate-600\"><em>Waterfront</em> é a orla ou calçadão em frente à água (no caso de Brasília, a beira do Lago Paranoá).</p>\n          </div>\n          <div class=\"p-4 rounded-xl bg-white border border-slate-200 shadow-2xs space-y-1\">\n            <span class=\"font-bold text-slate-900 text-sm block\">📌 \"Outgoing vs. Shy\" (O Paradoxo)</span>\n            <p class=\"text-xs text-slate-600\"><em>Outgoing</em> é extrovertida, expansiva e comunicativa; <em>Shy</em> é tímida e introvertida. A palavra <em>Although</em> (\"embora\") introduz esse contraste.</p>\n          </div>\n          <div class=\"p-4 rounded-xl bg-white border border-slate-200 shadow-2xs space-y-1\">\n            <span class=\"font-bold text-slate-900 text-sm block\">📌 \"Stand out & Get embarrassed\"</span>\n            <p class=\"text-xs text-slate-600\"><em>Stand out</em> significa se destacar ou querer aparecer. <em>Get embarrassed</em> significa ficar com vergonha ou encabulada facilmente.</p>\n          </div>\n        </div>\n\n        <h2>5. Atividade 3: Listen & Answer (O Treino do Reflexo Imediato)</h2>\n        <p>\n          O <strong>Listen & Answer</strong> é onde quebramos a dependência da tradução mental. O professor faz perguntas diretas em inglês e você responde imediatamente com o que vier à mente:\n        </p>\n        <ul class=\"space-y-2.5 my-4 pl-4 list-disc text-slate-700 text-sm sm:text-base\">\n          <li><strong>How old is Grazi?</strong> &rarr; <em>\"45!\"</em> ou <em>\"She is 45 years old.\"</em></li>\n          <li><strong>Where is Grazi from?</strong> &rarr; <em>\"Brasília, the capital of Brazil.\"</em> (Se você responder <em>New York</em> ou <em>Goiânia</em>, não tem problema: o importante é que você processou a pergunta e respondeu no reflexo!).</li>\n          <li><strong>What does Grazi do?</strong> &rarr; <em>\"She is a lawyer. She works for the federal government.\"</em> (No dia a dia, usa-se <em>What does she do?</em> em vez de <em>What is her profession?</em>).</li>\n          <li><strong>House or apartment?</strong> &rarr; <em>\"A big house near the lake with a beautiful view to the waterfront.\"</em></li>\n        </ul>\n\n        <h2>6. Look & Retell e Listen & Ask: O Desafio da Produção Ativa</h2>\n        <p>\n          Para fechar o domínio da história, a metodologia avança para duas atividades de ativação oral:\n        </p>\n        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4 my-6\">\n          <div class=\"p-5 rounded-2xl bg-amber-50/80 border border-amber-200 shadow-2xs space-y-2\">\n            <span class=\"text-amber-900 font-extrabold uppercase text-xs block\">🗣️ Look & Retell (Watch & Retell)</span>\n            <p class=\"text-xs sm:text-sm text-amber-950/90 leading-relaxed\">\n              Você reconta a história da Grazi com as suas próprias palavras, olhando apenas para as ilustrações ou para o filme animado. O iniciante reconta em frases simples (<em>\"Grazi is 45. She is from Brasília. She is a lawyer.\"</em>); o avançado conecta as ideias com mais detalhes. O objetivo é improvisar e se expressar com o inglês que você tem, sem decorar.\n            </p>\n          </div>\n          <div class=\"p-5 rounded-2xl bg-amber-50/80 border border-amber-200 shadow-2xs space-y-2\">\n            <span class=\"text-amber-900 font-extrabold uppercase text-xs block\">❓ Listen & Ask (O Treino de Fazer Perguntas)</span>\n            <p class=\"text-xs sm:text-sm text-amber-950/90 leading-relaxed\">\n              O professor faz uma afirmação provocativa ou falsa para forçar você a criar a pergunta correta na hora:\n              <br>&bull; <em>\"Grazi is not from Ohio!\"</em> &rarr; Pergunta: <strong>\"Where is she from?\"</strong>\n              <br>&bull; <em>\"Grazi doesn't live in a small condo!\"</em> &rarr; Pergunta: <strong>\"Where does she live?\"</strong>\n            </p>\n          </div>\n        </div>\n\n        <h2>7. Pronunciation Practice e o Filme da Grazi</h2>\n        <p>\n          Por fim, na <strong>Pronunciation Practice</strong>, treinamos a musculatura oral de trás para frente em blocos musicais:\n        </p>\n\n        <!-- Box Claro e de Alto Contraste da Seção 7 (Sem Fundos Escuros) -->\n        <div class=\"my-6 p-5 sm:p-6 rounded-2xl bg-amber-50/80 border-2 border-amber-200/90 shadow-2xs space-y-3\">\n          <span class=\"text-amber-900 font-black uppercase text-xs tracking-wider flex items-center gap-1.5\">\n            <i data-lucide=\"music\" class=\"w-4 h-4 text-amber-700\"></i> Construção Fonética de Trás para Frente:\n          </span>\n          <div class=\"font-mono text-xs sm:text-sm text-slate-900 space-y-1.5 bg-white p-4 rounded-xl border border-slate-200\">\n            <p class=\"text-slate-600\">&bull; <em>\"her life\"</em></p>\n            <p class=\"text-slate-700\">&bull; <em>\"change her life\"</em></p>\n            <p class=\"text-slate-800\">&bull; <em>\"woman who wants to change her life\"</em></p>\n            <p class=\"text-slate-900 font-semibold\">&bull; <em>\"45-year-old woman who wants to change her life\"</em></p>\n            <p class=\"text-amber-950 font-black pt-1.5 border-t border-slate-100\">&bull; <em>\"Graziella is a 45-year-old woman who wants to change her life.\"</em></p>\n          </div>\n        </div>\n\n        <p>\n          Ao assistir ao filminho animado da Grazi no final da lição, o seu cérebro conecta a imagem, a história e a pronúncia em uma única memória de longo prazo.\n        </p>","goldenTip":"Você não precisa de 50 regras de gramática para destravar o seu inglês. Você precisa vivenciar a mesma história — como a história da Grazi — escutando, respondendo no reflexo e recontando com as suas palavras até que cada frase saia da sua boca com a mesma naturalidade do seu português."}];

    function getLibrary() {
      // Limpa versoes antigas se existirem
      ['aef_blog_library', 'aef_blog_library_v2', 'aef_blog_library_v3', 'aef_blog_library_v4', 'aef_blog_library_v5'].forEach(k => localStorage.removeItem(k));

      const stored = localStorage.getItem('aef_blog_library_v6');
      if (!stored) {
        localStorage.setItem('aef_blog_library_v6', JSON.stringify(INITIAL_LIBRARY));
        return INITIAL_LIBRARY;
      }
      try {
        const parsed = JSON.parse(stored);
        let updated = false;
        INITIAL_LIBRARY.forEach(initialPost => {
          const idx = parsed.findIndex(p => p.id === initialPost.id || p.slug === initialPost.slug);
          if (idx === -1) {
            parsed.unshift(initialPost);
            updated = true;
          } else {
            if (!parsed[idx].bodyHtml || parsed[idx].bodyHtml.length < (initialPost.bodyHtml ? initialPost.bodyHtml.length : 0)) {
              parsed[idx] = initialPost;
              updated = true;
            }
          }
        });
        if (updated) {
          localStorage.setItem('aef_blog_library_v6', JSON.stringify(parsed));
        }
        return parsed;
      } catch (e) {
        localStorage.setItem('aef_blog_library_v6', JSON.stringify(INITIAL_LIBRARY));
        return INITIAL_LIBRARY;
      }
    }

    function saveLibrary(lib) {
      localStorage.setItem('aef_blog_library_v6', JSON.stringify(lib));
      renderLibrary();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.classList.remove('active', 'bg-white', 'text-slate-900', 'shadow-2xs');
        btn.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById(`filter-btn-${filter}`);
      if (activeBtn) {
        activeBtn.classList.add('active', 'bg-white', 'text-slate-900', 'shadow-2xs');
        activeBtn.classList.remove('text-slate-600');
      }
      renderLibrary();
    }

    function renderLibrary() {
      const lib = getLibrary();
      const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();

      // Stats
      const total = lib.length;
      const published = lib.filter(p => p.status === 'published').length;
      const drafts = lib.filter(p => p.status === 'draft').length;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-published').textContent = published;
      document.getElementById('stat-drafts').textContent = drafts;

      document.getElementById('count-all').textContent = total;
      document.getElementById('count-published').textContent = published;
      document.getElementById('count-draft').textContent = drafts;

      // Filter
      let filtered = lib;
      if (currentFilter === 'published') filtered = filtered.filter(p => p.status === 'published');
      if (currentFilter === 'draft') filtered = filtered.filter(p => p.status === 'draft');

      if (query) {
        filtered = filtered.filter(p => 
          (p.title || '').toLowerCase().includes(query) || 
          (p.category || '').toLowerCase().includes(query) ||
          (p.slug || '').toLowerCase().includes(query)
        );
      }

      const grid = document.getElementById('posts-grid');
      const empty = document.getElementById('empty-state');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(post => `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-2xs hover:shadow-md transition-all flex flex-col group">
          
          <!-- Image Header -->
          <div class="aspect-video bg-slate-900 relative overflow-hidden">
            <img src="${post.imageUrl || 'assets/images/og-magic-stories.jpg'}" alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-white/90 text-slate-900 backdrop-blur-xs shadow-2xs">${post.category}</span>
              ${post.status === 'published' 
                ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500 text-white shadow-2xs flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> Publicado</span>` 
                : `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-500 text-slate-950 shadow-2xs">Rascunho</span>`}
            </div>
            <button onclick="downloadPostCover('${post.id}')" class="absolute bottom-2.5 right-2.5 px-2 py-1 rounded-lg bg-slate-950/80 hover:bg-slate-900 text-white text-[10px] font-bold backdrop-blur-xs flex items-center gap-1 transition-colors" title="Baixar Capa 1280x720">
              <i data-lucide="download" class="w-3 h-3 text-amber-400"></i> Capa
            </button>
          </div>

          <!-- Body Info -->
          <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between space-y-4">
            <div class="space-y-1.5">
              <div class="flex items-center gap-2 text-[11px] text-slate-400">
                <span>${post.date}</span>
                <span>•</span>
                <span>${post.readTime || '5 min'}</span>
              </div>
              <h3 class="text-sm sm:text-base font-extrabold text-slate-900 leading-snug line-clamp-2">${post.title}</h3>
              <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${post.subtitle || ''}</p>
            </div>

            <!-- Actions Bar -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-1.5">
              <div class="flex items-center gap-1.5">
                <button onclick="openPreviewModal('${post.id}')" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold flex items-center gap-1 transition-colors shadow-2xs" title="Visualizar Artigo Completo">
                  <i data-lucide="eye" class="w-3.5 h-3.5 text-slate-600"></i>
                  <span>Ver</span>
                </button>
                <button onclick="togglePublishStatus('${post.id}')" class="px-2.5 py-1.5 rounded-xl ${post.status === 'published' ? 'bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200' : 'bg-emerald-600 hover:bg-emerald-700 text-white'} text-xs font-bold flex items-center gap-1 transition-colors shadow-2xs" title="${post.status === 'published' ? 'Mudar para Rascunho' : 'Publicar Artigo'}">
                  <i data-lucide="${post.status === 'published' ? 'file-edit' : 'send'}" class="w-3.5 h-3.5"></i>
                  <span>${post.status === 'published' ? 'Despublicar' : 'Publicar'}</span>
                </button>
              </div>

              <div class="flex items-center gap-1">
                <button onclick="editPost('${post.id}')" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-800 transition-colors" title="Editar Informações">
                  <i data-lucide="edit-2" class="w-4 h-4"></i>
                </button>
                <button onclick="deletePost('${post.id}')" class="p-1.5 rounded-lg hover:bg-rose-50 text-slate-400 hover:text-rose-600 transition-colors" title="Excluir Artigo">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

          </div>

        </div>
      `).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    function togglePublishStatus(id) {
      const lib = getLibrary();
      const post = lib.find(p => p.id === id);
      if (!post) return;

      if (post.status === 'published') {
        post.status = 'draft';
        showToast('Artigo alterado para Rascunho.');
        saveLibrary(lib);
      } else {
        post.status = 'published';
        saveLibrary(lib);
        openPublishModal(post);
      }
    }

    function openPreviewModal(id) {

      const post = lib.find(p => p.id === id);

      currentModalPost = post;

      document.getElementById('modal-preview-badge').textContent = post.status === 'published' ? 'Publicado' : 'Rascunho';
      document.getElementById('modal-preview-badge').className = post.status === 'published' 
        ? 'px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-emerald-100 text-emerald-800 border border-emerald-200'
        : 'px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-amber-100 text-amber-800 border border-amber-200';
      
      document.getElementById('modal-preview-slug').textContent = `${post.slug}.html`;
      document.getElementById('modal-preview-category').textContent = post.category;
      document.getElementById('modal-preview-date').textContent = post.date;
      document.getElementById('modal-preview-readtime').textContent = post.readTime || '6 min de leitura';
      document.getElementById('modal-preview-title').textContent = post.title;
      document.getElementById('modal-preview-subtitle').textContent = post.subtitle;

      // Media
      const media = document.getElementById('modal-preview-media');

      } else if (post.imageUrl) {

      // Takeaways

    function handleSaveArticle(e) {
      e.preventDefault();
      const id = document.getElementById('edit-post-id').value || 'post-' + Date.now();
      const ytUrl = document.getElementById('import-youtube-url').value.trim();
      let ytId = '';
      let img = 'assets/images/og-magic-stories.jpg';

      if (ytUrl) {
        const m = ytUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/))([\w-]{11})/);
        if (m && m[1]) {
          ytId = m[1];
          img = `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg`;
        }
      }

      const post = {
        id,
        title: document.getElementById('import-title').value.trim(),
        subtitle: document.getElementById('import-subtitle').value.trim(),
        category: document.getElementById('import-category').value,
        slug: document.getElementById('import-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-'),
        youtubeUrl: ytUrl,
        youtubeId: ytId,
        imageUrl: img,
        status: document.getElementById('import-status').value,
        readTime: '6 min de leitura',
        date: new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }),
        bodyHtml: document.getElementById('import-body-html').value.trim(),
        goldenTip: document.getElementById('import-golden-tip').value.trim()
      };

      const lib = getLibrary();
      const idx = lib.findIndex(p => p.id === id);
      if (idx >= 0) {
        lib[idx] = post;
      } else {
        lib.unshift(post);
      }

      saveLibrary(lib);
      closeImportModal();
      showToast('Artigo salvo na Biblioteca com sucesso! ✨');
    }

    function deletePost(id) {
      if (!confirm('Tem certeza que deseja excluir este artigo da biblioteca?')) return;
      const lib = getLibrary().filter(p => p.id !== id);
      saveLibrary(lib);
      showToast('Artigo removido.');
    }

    function downloadPostCover(id) {
      const lib = getLibrary();
      const post = lib.find(p => p.id === id);
      if (!post || !post.imageUrl) return;

      const a = document.createElement('a');
      a.href = post.imageUrl;
      a.download = `capa-${post.slug}-1280x720.jpg`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('Download da capa iniciado! ⬇️');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const m = document.getElementById('toast-message');
      m.textContent = msg;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        t.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Inicialização imediata e segura
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderLibrary);
    } else {
      renderLibrary();
    }
  </script>
</body>
</html>
