<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Player de Treino • AgoraEuFalo</title>
  <meta name="theme-color" content="#071224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AEF Player">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans + Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Dados Canônicos dos Módulos e Alunos (Cache Busted) -->
  <script src="data/magic-stories.js?v=20260901_2155"></script>
  <script src="data/quickstart.js?v=20260901_2155"></script>
  <script src="data/public.js?v=20260901_2155"></script>
  <script src="data/estevao.js?v=20260901_2155"></script>
  <script src="data/thomas.js?v=20260901_2155"></script>
  <script src="data/andre.js?v=20260901_2155"></script>
  <script src="data/matheus.js?v=20260901_2155"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #071224;
      color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .font-serif-title {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-mono-tag {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Range Scrubber Customization */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      height: 5px;
      outline: none;
      transition: height 0.15s ease;
    }
    input[type="range"]:hover, input[type="range"]:active {
      height: 7px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #F59E0B;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
      transition: transform 0.1s ease;
    }
    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.3);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #F59E0B;
      cursor: pointer;
      border: none;
    }

    /* Custom Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .lyrics-active {
      color: #F59E0B;
      font-weight: 800;
      opacity: 1;
      transform: scale(1.02);
      text-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
    }

    .lyrics-inactive {
      color: #94A3B8;
      opacity: 0.45;
      font-weight: 500;
    }
    .lyrics-inactive:hover {
      opacity: 0.85;
    }

    /* Ambient Glow Background */
    .ambient-glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(198, 138, 54, 0.18) 0%, rgba(13, 30, 54, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body style="min-height: 100dvh; max-height: 100dvh; height: 100dvh;" class="flex flex-col justify-between overflow-hidden antialiased bg-[#071224] text-slate-100">
  
  <div class="ambient-glow"></div>

  <!-- ========================================================================= -->
  <!-- 1. TOP HEADER: SAIR, SELETOR DE CURSOS/CATEGORIAS & MÓDULOS                -->
  <!-- ========================================================================= -->
  <header class="relative z-20 w-full max-w-lg mx-auto px-4 pt-2.5 pb-1 flex items-center justify-between gap-2 shrink-0">
    
    <!-- Botão Sair (Voltar ao Portal / Dashboard) -->
    <a id="btn-exit" href="../portal.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-slate-200 text-xs font-bold transition backdrop-blur-md border border-white/10 shrink-0" title="Sair para o Portal">
      <i data-lucide="log-out" class="w-3.5 h-3.5 text-amber-400"></i>
      <span>Sair</span>
    </a>

    <!-- Seletor Duplo: [Curso / Categoria] + [Módulo / Aluno / Faixa] -->
    <div class="flex items-center gap-1.5 min-w-0 flex-1 justify-center">
      
      <!-- Dropdown 1: Menu de Cursos / Categorias -->
      <div class="flex items-center bg-white/10 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-1 shrink-0 max-w-[145px]">
        <select id="course-select" onchange="window.selectCourse(this.value)" class="bg-transparent text-[11px] font-bold text-amber-300 focus:outline-none cursor-pointer truncate pr-0.5">
          <option value="ms-legacy" selected class="bg-slate-900 text-slate-100">📖 Magic Stories</option>
          <option value="english-quickstart" class="bg-slate-900 text-slate-100">⚡ QuickStart (EQS)</option>
          <option value="public" class="bg-slate-900 text-slate-100">💡 Novidades</option>
          <option value="vip" class="bg-slate-900 text-slate-100">👑 Mentoria VIP</option>
          <option value="custom" class="bg-slate-900 text-slate-100">🧪 Minhas Coisas</option>
        </select>
      </div>

      <!-- Dropdown 2: Menu de Módulos / Alunos / Faixas -->
      <div class="flex items-center bg-white/10 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-1 min-w-0 flex-1 max-w-[160px]">
        <select id="module-select" onchange="window.selectModule(this.value)" class="bg-transparent text-[11px] font-bold text-slate-100 focus:outline-none cursor-pointer truncate w-full">
          <!-- Injetado dinamicamente via JS -->
        </select>
      </div>

    </div>

    <!-- Botão Gaveta da Playlist -->
    <button onclick="window.togglePlaylistDrawer()" class="p-2 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-slate-200 transition backdrop-blur-md border border-white/10 shrink-0 relative" title="Lista de Aulas">
      <i data-lucide="list-music" class="w-4 h-4 text-amber-400"></i>
      <span id="playlist-count-badge" class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-amber-500 text-slate-950 font-mono text-[9px] font-black flex items-center justify-center">6</span>
    </button>
  </header>

  <!-- ========================================================================= -->
  <!-- 2. PALCO PRINCIPAL (HERO): ARTE 1:1 PURA & SPOTIFY / APPLE MUSIC STYLE    -->
  <!-- ========================================================================= -->
  <main class="relative z-10 flex-1 min-h-0 flex flex-col justify-center items-center px-4 py-1 max-w-lg mx-auto w-full">
    
    <!-- Barra Superior de Letra Rápida -->
    <div class="w-full flex items-center justify-end mb-2 px-1 shrink-0">
      <button onclick="window.toggleLyrics()" id="btn-toggle-lyrics-top" class="px-3.5 py-1 rounded-full bg-white/10 hover:bg-white/20 text-amber-300 text-xs font-bold transition border border-white/10 flex items-center gap-1.5 shadow-xs active:scale-95">
        <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
        <span id="btn-lyrics-top-text">Ver Letra</span>
      </button>
    </div>

    <!-- Container da Capa (1:1 Apple Style) -->
    <div class="w-full relative flex items-center justify-center min-h-0">
      <div id="stage-artwork-card" class="w-full aspect-square max-w-[240px] sm:max-w-[300px] max-h-[30vh] sm:max-h-[36vh] rounded-3xl overflow-hidden shadow-2xl border border-white/15 bg-slate-900 relative group transition-transform duration-300">
        <img id="track-cover-img" src="../assets/images/logo-fundo-escuro.png" alt="Capa da Lição" class="w-full h-full object-cover">
        
        <!-- Badge da Atividade no Canto -->
        <div class="absolute top-2.5 left-2.5 px-2.5 py-0.5 rounded-full bg-slate-950/80 backdrop-blur-md border border-white/20 text-[9px] font-mono-tag font-bold text-amber-300">
          <span id="track-badge-text">1. LISTEN & READ</span>
        </div>

        <!-- Indicador de Áudio Pulsante no Canto -->
        <div id="playing-pulse-indicator" class="hidden absolute bottom-2.5 right-2.5 px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 text-[9px] font-mono font-black flex items-center gap-1 shadow-lg">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-950 animate-ping"></span>
          <span>TOCANDO</span>
        </div>
      </div>
    </div>

    <!-- Título da Aula & Subtítulo do Módulo -->
    <div class="w-full text-center mt-2.5 mb-0 px-2 shrink-0">
      <h2 id="lesson-title" class="font-serif-title font-bold text-sm sm:text-base text-slate-50 truncate tracking-wide">
        Aula 01: Listen & Read (LR)
      </h2>
      <p id="module-subhead" class="text-[11px] text-slate-400 font-medium mt-0.5 truncate">
        MS001 • Grazi Wants to Change
      </p>
    </div>

  </main>

  <!-- ========================================================================= -->
  <!-- 3. CONTROLES DE REPRODUÇÃO (DOCK ERGONÔMICO APPLE MUSIC / SPOTIFY)        -->
  <!-- ========================================================================= -->
  <footer class="relative z-20 w-full max-w-lg mx-auto px-5 pb-5 sm:pb-6 pt-1 space-y-2 shrink-0">
    
    <!-- Scrubber / Barra de Progresso de Áudio -->
    <div class="w-full space-y-0.5">
      <input type="range" id="audio-seek-bar" min="0" max="100" value="0" step="0.1" oninput="window.handleSeek(this.value)" class="w-full cursor-pointer">
      <div class="flex items-center justify-between text-[10px] font-mono-tag font-medium text-slate-400 px-0.5">
        <span id="time-current">00:00</span>
        <span id="time-total">00:00</span>
      </div>
    </div>

    <!-- Controles Principais de Reprodução (Layout Espaçoso de 5 Botões) -->
    <div class="flex items-center justify-between px-2 pt-0.5">
      
      <!-- Aula / Faixa Anterior -->
      <button onclick="window.playPrevLesson()" class="p-2.5 rounded-full text-slate-300 hover:text-white transition hover:bg-white/10 active:scale-90" title="Aula Anterior">
        <i data-lucide="skip-back" class="w-5 h-5 fill-current"></i>
      </button>

      <!-- Voltar 10s -->
      <button onclick="window.seekOffset(-10)" class="p-2.5 rounded-full text-slate-300 hover:text-white transition hover:bg-white/10 active:scale-90" title="Voltar 10 segundos">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>

      <!-- Botão Central Play / Pause Master Espaçoso -->
      <button onclick="window.togglePlayPause()" id="btn-main-play" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center shadow-xl shadow-amber-500/30 transition active:scale-90 cursor-pointer shrink-0" title="Tocar / Pausar">
        <i data-lucide="play" class="w-7 h-7 fill-current ml-0.5" id="icon-main-play"></i>
      </button>

      <!-- Avançar 10s -->
      <button onclick="window.seekOffset(10)" class="p-2.5 rounded-full text-slate-300 hover:text-white transition hover:bg-white/10 active:scale-90" title="Avançar 10 segundos">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>

      <!-- Próxima Aula / Faixa -->
      <button onclick="window.playNextLesson()" class="p-2.5 rounded-full text-slate-300 hover:text-white transition hover:bg-white/10 active:scale-90" title="Próxima Aula">
        <i data-lucide="skip-forward" class="w-5 h-5 fill-current"></i>
      </button>

    </div>

    <!-- Barra Utilitária Inferior: Continuous Play, Velocidade e Toggle de Letra -->
    <div class="flex items-center justify-between px-1 pt-0.5 gap-1.5">
      <button onclick="window.toggleContinuousPlay()" id="btn-continuous-play" class="flex items-center gap-1.5 text-[11px] font-bold text-amber-400 hover:text-amber-300 transition active:scale-95 py-1 px-2.5 rounded-full bg-white/5 border border-white/10 shrink-0" title="Alternar Reprodução Contínua">
        <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
        <span id="text-continuous-play">Contínuo: ON</span>
      </button>

      <!-- Controle de Velocidade -->
      <button onclick="window.cyclePlaybackRate()" id="btn-speed" class="flex items-center gap-1 text-[11px] font-bold text-slate-300 hover:text-white transition active:scale-95 py-1 px-2.5 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 shrink-0" title="Velocidade de Reprodução">
        <i data-lucide="gauge" class="w-3.5 h-3.5 text-amber-400"></i>
        <span id="text-speed">1.0x</span>
      </button>

      <button onclick="window.toggleLyrics()" id="btn-lyrics-bottom" class="flex items-center gap-1.5 text-[11px] font-bold text-slate-300 hover:text-white transition active:scale-95 py-1 px-3 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 shrink-0" title="Ver Letra da Aula">
        <i data-lucide="quote" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>Ver Letra</span>
      </button>
    </div>

  </footer>

  <!-- ========================================================================= -->
  <!-- 4. PAINEL DE LETRA DESLIZANTE (SLIDING LYRICS VIEW - ESTILO APPLE/SPOTIFY)-->
  <!-- ========================================================================= -->
  <div id="lyrics-sheet" class="fixed inset-x-0 bottom-0 z-40 bg-[#071224]/95 backdrop-blur-2xl border-t border-white/10 rounded-t-3xl shadow-2xl transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[82vh] h-[82vh]">
    
    <!-- Puxador & Header da Letra -->
    <div class="px-6 pt-3 pb-2.5 flex items-center justify-between border-b border-white/10 shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-amber-400"></div>
        <span class="text-xs font-mono-tag font-bold text-slate-300 uppercase">Transcrição da Aula</span>
      </div>

      <!-- Toggle Tradução Falada Real -->
      <button onclick="window.toggleTranslation()" id="btn-lyrics-trans" class="px-3 py-1 rounded-full bg-white/10 text-[11px] font-bold text-slate-300 hover:text-white transition border border-white/10">
        Tradução: <span id="text-trans-status" class="text-amber-400">OFF</span>
      </button>

      <!-- Fechar Letra -->
      <button onclick="window.toggleLyrics()" class="p-1.5 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 transition">
        <i data-lucide="chevron-down" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Lista de Frases Contínuas -->
    <div id="lyrics-scroll-container" class="flex-1 overflow-y-auto px-6 py-6 space-y-5 no-scrollbar text-left scroll-smooth">
      <!-- Injetado dinamicamente via JS -->
    </div>

  </div>

  <!-- ========================================================================= -->
  <!-- 5. GAVETA DE PLAYLIST DE AULAS DO MÓDULO (BOTTOM SHEET / DRAWER)          -->
  <!-- ========================================================================= -->
  <div id="playlist-drawer-overlay" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden transition-opacity duration-300" onclick="window.togglePlaylistDrawer()"></div>
  
  <div id="playlist-drawer" class="fixed inset-x-0 bottom-0 z-50 bg-[#0A192F] border-t border-white/15 rounded-t-3xl shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[75vh] flex flex-col">
    <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between shrink-0">
      <div>
        <h3 class="font-bold text-sm text-slate-100">Playlist do Módulo</h3>
        <p id="drawer-module-subtitle" class="text-xs text-amber-400 font-mono mt-0.5">MS001 • Grazi Wants to Change</p>
      </div>
      <button onclick="window.togglePlaylistDrawer()" class="p-1.5 rounded-full bg-white/10 text-slate-300 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div id="playlist-items-container" class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar">
      <!-- Injetado dinamicamente via JS -->
    </div>
  </div>

  <!-- Audio Element Oculto -->
  <audio id="core-audio" preload="auto" playsinline></audio>

  <!-- Toast Notification -->
  <div id="aef-toast" class="fixed bottom-24 inset-x-0 mx-auto w-max max-w-xs px-4 py-2 rounded-2xl bg-amber-500 text-slate-950 font-bold text-xs text-center shadow-2xl z-50 hidden transition-all">
    Notificação
  </div>

  <!-- ========================================================================= -->
  <!-- 6. ENGINE JAVASCRIPT DO UNIFIED PLAYER                                    -->
  <!-- ========================================================================= -->
  <script>
    // ESTADO GLOBAL DO PLAYER
    const state = {
      courseId: "ms-legacy",
      activeModuleId: "ms001-grazi",
      activeLessonIndex: 0,
      isPlaying: false,
      isContinuousPlay: true,
      isLyricsOpen: false,
      showTranslation: false,
      playbackRate: 1.0,
      currentSentenceIndex: 0,
      audio: document.getElementById('core-audio'),
      pendingPlayPromise: null
    };

    // INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      parseUrlParams();
      populateCourseSelect();
      populateModuleSelect();
      loadCurrentContent(state.activeLessonIndex);
      setupAudioEvents();
    });

    function parseUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const curso = params.get('curso') || params.get('category');
      const mod = params.get('modulo') || params.get('aluno');
      const aula = params.get('aula') || params.get('track');

      if (curso) state.courseId = curso;
      if (mod) state.activeModuleId = mod;

      const tracks = getCurrentTracklist();
      if (aula && tracks.length > 0) {
        const foundIdx = tracks.findIndex(t => t.id === aula || t.id.includes(aula));
        if (foundIdx !== -1) state.activeLessonIndex = foundIdx;
      }
    }

    function populateCourseSelect() {
      const select = document.getElementById('course-select');
      if (select) select.value = state.courseId;
    }

    window.selectCourse = (courseId) => {
      state.courseId = courseId;
      state.activeLessonIndex = 0;
      
      // Define o primeiro módulo/aluno padrão do curso escolhido
      if (courseId === 'ms-legacy' || courseId === 'magic-stories') {
        state.activeModuleId = window.AEF_MAGIC_STORIES?.modules?.[0]?.id || "ms001-grazi";
      } else if (courseId === 'english-quickstart' || courseId === 'eqs') {
        state.activeModuleId = window.AEF_QUICKSTART?.modules?.[0]?.id || "eqs-m0";
      } else if (courseId === 'vip') {
        state.activeModuleId = "estevao";
      } else if (courseId === 'public') {
        state.activeModuleId = "public-demo";
      } else if (courseId === 'custom') {
        state.activeModuleId = "custom-lab";
      }

      populateModuleSelect();
      loadCurrentContent(0);
    };

    function populateModuleSelect() {
      const select = document.getElementById('module-select');
      if (!select) return;

      if (state.courseId === 'ms-legacy' || state.courseId === 'magic-stories') {
        const msModules = window.AEF_MAGIC_STORIES?.modules || [];
        select.innerHTML = msModules.map(m => `
          <option value="${m.id}" ${m.id === state.activeModuleId ? 'selected' : ''} class="bg-slate-900 text-slate-100">
            ${m.shortTitle || m.title}
          </option>
        `).join('');
      } else if (state.courseId === 'english-quickstart' || state.courseId === 'eqs') {
        const eqsModules = window.AEF_QUICKSTART?.modules || [];
        select.innerHTML = eqsModules.map(m => `
          <option value="${m.id}" ${m.id === state.activeModuleId ? 'selected' : ''} class="bg-slate-900 text-slate-100">
            ${m.shortTitle || m.title}
          </option>
        `).join('');
      } else if (state.courseId === 'vip') {
        const mentees = [
          { id: 'estevao', name: 'Estêvão (Executivo)' },
          { id: 'thomas', name: 'Thomas (Tech Lead)' },
          { id: 'andre', name: 'André (Entrevistas)' },
          { id: 'matheus', name: 'Matheus (Fluência)' }
        ];
        select.innerHTML = mentees.map(m => `
          <option value="${m.id}" ${m.id === state.activeModuleId ? 'selected' : ''} class="bg-slate-900 text-slate-100">
            ${m.name}
          </option>
        `).join('');
      } else if (state.courseId === 'public') {
        select.innerHTML = `<option value="public-demo" selected class="bg-slate-900 text-slate-100">💡 Novidades (Free Plan)</option>`;
      } else if (state.courseId === 'custom') {
        select.innerHTML = `<option value="custom-lab" selected class="bg-slate-900 text-slate-100">🧪 Laboratório Pessoal</option>`;
      }
    }

    window.selectModule = (modId) => {
      state.activeModuleId = modId;
      state.activeLessonIndex = 0;
      loadCurrentContent(0);
    };

    function getCurrentTracklist() {
      if (state.courseId === 'ms-legacy' || state.courseId === 'magic-stories') {
        const msModules = window.AEF_MAGIC_STORIES?.modules || [];
        const mod = msModules.find(m => m.id === state.activeModuleId) || msModules[0];
        return mod?.tracks || [];
      } else if (state.courseId === 'english-quickstart' || state.courseId === 'eqs') {
        const eqsModules = window.AEF_QUICKSTART?.modules || [];
        const mod = eqsModules.find(m => m.id === state.activeModuleId) || eqsModules[0];
        return mod?.tracks || [];
      } else if (state.courseId === 'vip') {
        if (state.activeModuleId === 'estevao') return window.AEF_STUDENT_ESTEVAO?.tracks || [];
        if (state.activeModuleId === 'thomas') return window.AEF_STUDENT_THOMAS?.tracks || [];
        if (state.activeModuleId === 'andre') return window.AEF_STUDENT_ANDRE?.tracks || [];
        if (state.activeModuleId === 'matheus') return window.AEF_STUDENT_MATHEUS?.tracks || [];
        return window.AEF_STUDENT_ESTEVAO?.tracks || [];
      } else if (state.courseId === 'public') {
        return window.AEF_STUDENT_PUBLIC?.tracks || [];
      } else if (state.courseId === 'custom') {
        const userCustoms = JSON.parse(localStorage.getItem('aef_custom_tracks') || '[]');
        return userCustoms;
      }
      return [];
    }

    function getCurrentActiveTrack() {
      const tracks = getCurrentTracklist();
      return tracks[state.activeLessonIndex] || tracks[0];
    }

    function getCurrentModuleTitle() {
      if (state.courseId === 'ms-legacy' || state.courseId === 'magic-stories') {
        const msModules = window.AEF_MAGIC_STORIES?.modules || [];
        const mod = msModules.find(m => m.id === state.activeModuleId) || msModules[0];
        return mod?.title || 'Magic Story';
      } else if (state.courseId === 'english-quickstart' || state.courseId === 'eqs') {
        const eqsModules = window.AEF_QUICKSTART?.modules || [];
        const mod = eqsModules.find(m => m.id === state.activeModuleId) || eqsModules[0];
        return mod?.title || 'English QuickStart';
      } else if (state.courseId === 'vip') {
        const names = { estevao: 'Estêvão', thomas: 'Thomas', andre: 'André', matheus: 'Matheus' };
        return `👑 Mentoria VIP • ${names[state.activeModuleId] || 'Aluno'}`;
      } else if (state.courseId === 'public') {
        return '💡 Novidades • Free Plan';
      } else if (state.courseId === 'custom') {
        return '🧪 Minhas Coisas • Laboratório';
      }
      return 'AgoraEuFalo';
    }

    function loadCurrentContent(lessonIdx) {
      state.activeLessonIndex = lessonIdx;
      const track = getCurrentActiveTrack();
      const moduleTitle = getCurrentModuleTitle();

      // 1. Atualiza Título, Subtítulo e Capa
      const titleEl = document.getElementById('lesson-title');
      if (titleEl) titleEl.innerText = track?.title || (track ? `Faixa ${state.activeLessonIndex + 1}` : 'Nenhum treino selecionado');

      const subheadEl = document.getElementById('module-subhead');
      if (subheadEl) subheadEl.innerText = moduleTitle;

      const badgeEl = document.getElementById('track-badge-text');
      if (badgeEl) {
        if (state.courseId === 'ms-legacy') {
          badgeEl.innerText = (track?.activity || `AULA ${state.activeLessonIndex + 1}`).replace('_', ' ').toUpperCase();
        } else if (state.courseId === 'vip') {
          badgeEl.innerText = 'PRESCRIÇÃO VIP 1 A 1';
        } else if (state.courseId === 'public') {
          badgeEl.innerText = 'NOVIDADES FREE';
        } else {
          badgeEl.innerText = 'LABORATÓRIO';
        }
      }

      const coverImg = document.getElementById('track-cover-img');
      if (coverImg) coverImg.src = track?.coverImage || '../assets/images/logo-fundo-escuro.png';

      // 2. Configura Áudio Puro MP3 (com fallback para videoUrl se necessário)
      const audioSrc = track?.audioUrl || track?.videoUrl || '';
      state.audio.src = audioSrc;
      state.audio.playbackRate = state.playbackRate;
      state.audio.load();

      // 3. Renderiza Componentes e MediaSession
      renderLyrics();
      renderPlaylistDrawer();
      updateMediaSession();
      lucide.createIcons();
    }

    function renderLyrics() {
      const container = document.getElementById('lyrics-scroll-container');
      const track = getCurrentActiveTrack();
      if (!container) return;

      const sentences = track?.sentences || [];
      if (sentences.length === 0) {
        container.innerHTML = `
          <div class="text-center text-slate-400 text-sm py-12">
            <p>Nenhuma transcrição cadastrada para esta aula.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = sentences.map((s, idx) => `
        <div id="lyric-line-${idx}" onclick="window.seekToSentence(${idx})" class="lyrics-line transition-all duration-300 cursor-pointer p-2 rounded-xl hover:bg-white/5 ${idx === state.currentSentenceIndex ? 'lyrics-active' : 'lyrics-inactive'}">
          <p class="text-base sm:text-lg leading-relaxed">${s.text}</p>
          ${state.showTranslation && s.spokenTranslation ? `
            <p class="text-xs sm:text-sm text-amber-200/80 font-medium mt-1 font-serif-title italic">${s.spokenTranslation}</p>
          ` : ''}
        </div>
      `).join('');
    }

    window.toggleLyrics = () => {
      state.isLyricsOpen = !state.isLyricsOpen;
      const sheet = document.getElementById('lyrics-sheet');
      const topBtnText = document.getElementById('btn-lyrics-top-text');
      const bottomBtn = document.getElementById('btn-lyrics-bottom');

      if (state.isLyricsOpen) {
        sheet?.classList.remove('translate-y-full');
        if (topBtnText) topBtnText.innerText = "Ocultar";
        bottomBtn?.classList.add('bg-amber-500', 'text-slate-950');
        bottomBtn?.classList.remove('bg-white/10', 'text-slate-300');
        scrollActiveLyricIntoView();
      } else {
        sheet?.classList.add('translate-y-full');
        if (topBtnText) topBtnText.innerText = "Ver Letra";
        bottomBtn?.classList.remove('bg-amber-500', 'text-slate-950');
        bottomBtn?.classList.add('bg-white/10', 'text-slate-300');
      }
    };

    window.toggleTranslation = () => {
      state.showTranslation = !state.showTranslation;
      const statusText = document.getElementById('text-trans-status');
      if (statusText) statusText.innerText = state.showTranslation ? "ON" : "OFF";
      renderLyrics();
      showToast(state.showTranslation ? "Tradução Ativada" : "Tradução Ocultada");
    };

    window.seekToSentence = (idx) => {
      const track = getCurrentActiveTrack();
      const sentence = track?.sentences?.[idx];
      if (!sentence) return;

      if (sentence.start !== undefined) {
        state.audio.currentTime = sentence.start;
      }
      if (!state.isPlaying) {
        window.playAudio();
      }
      state.currentSentenceIndex = idx;
      updateLyricsHighlight();
    };

    function updateLyricsHighlight() {
      const track = getCurrentActiveTrack();
      const sentences = track?.sentences || [];
      sentences.forEach((_, idx) => {
        const line = document.getElementById(`lyric-line-${idx}`);
        if (!line) return;
        if (idx === state.currentSentenceIndex) {
          line.className = "lyrics-line transition-all duration-300 cursor-pointer p-2 rounded-xl hover:bg-white/5 lyrics-active";
        } else {
          line.className = "lyrics-line transition-all duration-300 cursor-pointer p-2 rounded-xl hover:bg-white/5 lyrics-inactive";
        }
      });
      scrollActiveLyricIntoView();
    }

    function scrollActiveLyricIntoView() {
      if (!state.isLyricsOpen) return;
      const activeLine = document.getElementById(`lyric-line-${state.currentSentenceIndex}`);
      const container = document.getElementById('lyrics-scroll-container');
      if (activeLine && container) {
        const offset = activeLine.offsetTop - container.offsetTop - (container.clientHeight / 2) + 40;
        container.scrollTo({ top: offset, behavior: 'smooth' });
      }
    }

    // CONTROLES DE ÁUDIO & PLAY/PAUSE IMEDIATO
    window.playAudio = async () => {
      if (state.pendingPlayPromise !== null) {
        try { await state.pendingPlayPromise; } catch (_e) {}
        state.pendingPlayPromise = null;
      }
      state.audio.playbackRate = state.playbackRate;
      state.pendingPlayPromise = state.audio.play();
      state.pendingPlayPromise
        .then(() => {
          state.isPlaying = true;
          state.pendingPlayPromise = null;
          updatePlayButtonUI();
        })
        .catch(err => {
          if (err.name !== 'AbortError') console.warn('[AEF] play error:', err);
          state.isPlaying = false;
          state.pendingPlayPromise = null;
          updatePlayButtonUI();
        });
      updatePlayButtonUI();
    };

    window.togglePlayPause = async () => {
      if (state.isPlaying) {
        if (state.pendingPlayPromise !== null) {
          try { await state.pendingPlayPromise; } catch (_e) {}
          state.pendingPlayPromise = null;
        }
        state.audio.pause();
        state.isPlaying = false;
        updatePlayButtonUI();
      } else {
        window.playAudio();
      }
    };

    function updatePlayButtonUI() {
      const icon = document.getElementById('icon-main-play');
      const pulse = document.getElementById('playing-pulse-indicator');
      if (icon) {
        icon.setAttribute('data-lucide', state.isPlaying ? 'pause' : 'play');
        lucide.createIcons();
      }
      if (pulse) {
        if (state.isPlaying) {
          pulse.classList.remove('hidden');
        } else {
          pulse.classList.add('hidden');
        }
      }
    }

    window.seekOffset = (sec) => {
      state.audio.currentTime = Math.max(0, state.audio.currentTime + sec);
    };

    window.handleSeek = (pct) => {
      const dur = state.audio.duration;
      if (dur > 0) {
        state.audio.currentTime = (pct / 100) * dur;
      }
    };

    // CONTROLE DE VELOCIDADE
    const SPEED_STEPS = [1.0, 1.25, 1.5, 0.75];
    window.cyclePlaybackRate = () => {
      const currentIdx = SPEED_STEPS.indexOf(state.playbackRate);
      const nextIdx = (currentIdx + 1) % SPEED_STEPS.length;
      state.playbackRate = SPEED_STEPS[nextIdx];
      state.audio.playbackRate = state.playbackRate;

      const text = document.getElementById('text-speed');
      if (text) text.innerText = `${state.playbackRate}x`;
      showToast(`Velocidade: ${state.playbackRate}x`);
    };

    window.playNextLesson = () => {
      const tracks = getCurrentTracklist();
      if (state.activeLessonIndex < tracks.length - 1) {
        loadCurrentContent(state.activeLessonIndex + 1);
        window.playAudio();
      } else {
        // Se for Magic Stories ou EQS, tenta avançar para o próximo módulo
        let modulesList = [];
        if (state.courseId === 'ms-legacy' || state.courseId === 'magic-stories') {
          modulesList = window.AEF_MAGIC_STORIES?.modules || [];
        } else if (state.courseId === 'english-quickstart' || state.courseId === 'eqs') {
          modulesList = window.AEF_QUICKSTART?.modules || [];
        }

        const curModIdx = modulesList.findIndex(m => m.id === state.activeModuleId);
        if (curModIdx !== -1 && curModIdx < modulesList.length - 1) {
          state.activeModuleId = modulesList[curModIdx + 1].id;
          populateModuleSelect();
          loadCurrentContent(0);
          window.playAudio();
          showToast(`Avançando para ${modulesList[curModIdx + 1].shortTitle || modulesList[curModIdx + 1].title}`);
          return;
        }
        showToast('Fim da playlist!');
      }
    };

    window.playPrevLesson = () => {
      if (state.activeLessonIndex > 0) {
        loadCurrentContent(state.activeLessonIndex - 1);
        window.playAudio();
      }
    };

    window.toggleContinuousPlay = () => {
      state.isContinuousPlay = !state.isContinuousPlay;
      const text = document.getElementById('text-continuous-play');
      const btn = document.getElementById('btn-continuous-play');
      if (state.isContinuousPlay) {
        if (text) text.innerText = 'Contínuo: ON';
        btn?.classList.add('text-amber-400');
        btn?.classList.remove('text-slate-400');
        showToast('Reprodução Contínua ON');
      } else {
        if (text) text.innerText = 'Contínuo: OFF';
        btn?.classList.remove('text-amber-400');
        btn?.classList.add('text-slate-400');
        showToast('Reprodução Contínua OFF');
      }
    };

    function setupAudioEvents() {
      state.audio.addEventListener('timeupdate', handleTimeUpdate);
      state.audio.addEventListener('ended', handleTrackEnded);
      state.audio.addEventListener('play', () => { state.isPlaying = true; updatePlayButtonUI(); });
      state.audio.addEventListener('pause', () => { state.isPlaying = false; updatePlayButtonUI(); });
    }

    function handleTimeUpdate() {
      const cur = state.audio.currentTime;
      const dur = state.audio.duration || 0;

      // Atualiza Scrubber e Timers
      const curTimeEl = document.getElementById('time-current');
      const totTimeEl = document.getElementById('time-total');
      const seekBar = document.getElementById('audio-seek-bar');

      if (curTimeEl) curTimeEl.innerText = formatTime(cur);
      if (totTimeEl) totTimeEl.innerText = formatTime(dur);

      if (seekBar && dur > 0) {
        const pct = (cur / dur) * 100;
        seekBar.value = pct;
        seekBar.style.background = `linear-gradient(to right, #F59E0B 0%, #F59E0B ${pct}%, rgba(255,255,255,0.15) ${pct}%, rgba(255,255,255,0.15) 100%)`;
      }

      // Sincroniza Linha Ativa da Letra
      const track = getCurrentActiveTrack();
      const sentences = track?.sentences || [];
      let foundIdx = -1;
      for (let i = 0; i < sentences.length; i++) {
        const s = sentences[i];
        if (s.start !== undefined && s.end !== undefined) {
          const nextStart = (i + 1 < sentences.length && sentences[i+1].start !== undefined) ? sentences[i+1].start : (s.end + 1.0);
          if (cur >= (s.start - 0.05) && cur < nextStart) {
            foundIdx = i;
            break;
          }
        }
      }

      if (foundIdx !== -1 && foundIdx !== state.currentSentenceIndex) {
        state.currentSentenceIndex = foundIdx;
        updateLyricsHighlight();
      }
    }

    function handleTrackEnded() {
      state.isPlaying = false;
      updatePlayButtonUI();
      if (state.isContinuousPlay) {
        window.playNextLesson();
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // PLAYLIST DRAWER
    window.togglePlaylistDrawer = () => {
      const overlay = document.getElementById('playlist-drawer-overlay');
      const drawer = document.getElementById('playlist-drawer');
      if (!overlay || !drawer) return;

      const isClosed = overlay.classList.contains('hidden');
      if (isClosed) {
        overlay.classList.remove('hidden');
        drawer.classList.remove('translate-y-full');
      } else {
        overlay.classList.add('hidden');
        drawer.classList.add('translate-y-full');
      }
    };

    function renderPlaylistDrawer() {
      const tracks = getCurrentTracklist();
      const moduleTitle = getCurrentModuleTitle();
      const container = document.getElementById('playlist-items-container');
      const badge = document.getElementById('playlist-count-badge');
      const sub = document.getElementById('drawer-module-subtitle');

      if (sub) sub.innerText = moduleTitle;
      if (badge) badge.innerText = tracks.length;
      if (!container) return;

      if (tracks.length === 0) {
        container.innerHTML = `
          <div class="text-center text-slate-400 text-xs py-8">
            <p>Nenhuma faixa disponível nesta categoria.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = tracks.map((t, idx) => `
        <div onclick="window.selectLessonFromDrawer(${idx})" class="p-3 rounded-2xl flex items-center justify-between gap-3 cursor-pointer transition ${
          idx === state.activeLessonIndex ? 'bg-amber-500 text-slate-950 font-bold shadow-md' : 'bg-white/5 hover:bg-white/10 text-slate-200'
        }">
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-xs font-mono opacity-60">${String(idx + 1).padStart(2, '0')}</span>
            <div class="truncate">
              <p class="text-xs font-bold truncate">${t.title}</p>
              <p class="text-[10px] font-mono opacity-80">${t.duration || ''}</p>
            </div>
          </div>
          <div class="shrink-0">
            <i data-lucide="${idx === state.activeLessonIndex ? 'volume-2' : 'play'}" class="w-4 h-4"></i>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    window.selectLessonFromDrawer = (idx) => {
      loadCurrentContent(idx);
      window.togglePlaylistDrawer();
      window.togglePlayPause();
    };

    // MEDIASESSION (LOCKSCREEN CONTROLS)
    function updateMediaSession() {
      if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
      const track = getCurrentActiveTrack();
      const moduleTitle = getCurrentModuleTitle();
      const coverUrl = new URL(track?.coverImage || '../assets/images/logo-fundo-escuro.png', window.location.href).href;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: track?.title || 'AgoraEuFalo',
        artist: 'Prof. Leonardo Leite • AgoraEuFalo',
        album: moduleTitle,
        artwork: [
          { src: coverUrl, sizes: '512x512', type: 'image/jpeg' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', () => window.togglePlayPause());
      navigator.mediaSession.setActionHandler('pause', () => window.togglePlayPause());
      navigator.mediaSession.setActionHandler('nexttrack', () => window.playNextLesson());
      navigator.mediaSession.setActionHandler('previoustrack', () => window.playPrevLesson());
      navigator.mediaSession.setActionHandler('seekbackward', () => window.seekOffset(-10));
      navigator.mediaSession.setActionHandler('seekforward', () => window.seekOffset(10));
    }

    function showToast(msg) {
      const toast = document.getElementById('aef-toast');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2800);
    }
  </script>
</body>
</html>
