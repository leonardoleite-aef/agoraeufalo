<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Lab Manager | AgoraEuFalo</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { aef: { navy: '#0A192F', bg: '#060D17' } } } }
    }
  </script>
  <script src="assets/js/aef-domain-router.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/aef-courses-registry.js"></script>
  <script src="assets/js/aef-cloud-sync.js"></script>
  <script src="assets/js/aef-access-engine.js"></script>
  <script src="assets/js/aef-portal-auth.js"></script>
  <script src="assets/js/aef-admin-nav.js"></script>
</head>
<body class="bg-[#060D17] text-slate-100 min-h-screen flex flex-col font-sans antialiased">
  
  <header class="bg-[#0A192F] border-b border-white/10 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center"><img src="assets/images/AEF-Logo_2026_fundo_escuro-800x300.png" alt="AEF" class="h-7 object-contain"></a>
        <div class="border-l border-white/10 pl-3">
          <span class="px-2.5 py-0.5 rounded-full bg-rose-500 text-white font-black text-[10px] tracking-wider uppercase">YOUTUBE LAB</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-bold flex items-center gap-1.5 shadow-sm">
          <span>🎬</span> <span class="text-slate-400 font-normal">Total:</span> <span id="badgeTotal" class="text-white font-mono font-black">0</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="youtube-lab.html" target="_blank" class="px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 font-bold text-xs transition flex items-center gap-1.5">
          <i data-lucide="external-link" class="w-3.5 h-3.5 text-amber-400"></i> Ver Vitrine
        </a>
        <button onclick="toggleView('editor')" class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider transition">
          + Novo Vídeo
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full px-6 py-6 flex-1">
    <!-- VIEW DASHBOARD -->
    <div id="view-dashboard" class="space-y-6">
      <div class="bg-[#0A192F] p-4 rounded-2xl border border-white/10 flex items-center justify-between">
        <div class="relative w-full max-w-md">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="searchInput" onkeyup="filterVideos()" placeholder="Buscar vídeos..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-[#060D17] border border-white/10 text-white text-xs focus:border-amber-400 focus:outline-none">
        </div>
      </div>
      <div class="bg-[#0A192F] rounded-2xl border border-white/10 overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-white/5 text-slate-300 text-xs uppercase font-bold border-b border-white/10">
            <tr>
              <th class="px-6 py-4">Vídeo</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Destaque Home</th>
              <th class="px-6 py-4 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="videosTableBody" class="divide-y divide-white/5">
            <tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Carregando acervo...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- VIEW EDITOR -->
    <div id="view-editor" class="hidden max-w-4xl mx-auto space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold" id="editorTitle">Importar Novo Vídeo</h2>
        <button onclick="toggleView('dashboard')" class="text-slate-400 hover:text-white flex items-center gap-2 text-sm"><i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar</button>
      </div>

      <div class="bg-[#0A192F] p-6 rounded-2xl border border-white/10 space-y-6">
        <!-- BLOCO 1: IMPORTAÇÃO -->
        <div class="flex gap-4 items-end pb-6 border-b border-white/10">
          <div class="flex-1">
            <label class="block text-xs font-bold text-slate-400 mb-2">URL do YouTube</label>
            <input type="text" id="ytUrl" placeholder="https://youtube.com/watch?v=..." class="w-full px-4 py-2.5 bg-[#060D17] border border-white/10 rounded-xl text-white text-sm focus:border-amber-400 outline-none">
          </div>
          <button type="button" onclick="fetchYtData()" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm transition flex items-center gap-2">
            <i data-lucide="download-cloud" class="w-4 h-4"></i> Puxar Dados
          </button>
        </div>

        <form id="editorForm" onsubmit="saveVideo(event)" class="space-y-6">
          <input type="hidden" id="videoId">
          <input type="hidden" id="thumbnailUrl">
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="col-span-1 rounded-xl overflow-hidden bg-black aspect-video border border-white/10 flex items-center justify-center relative group" id="thumbPreview">
              <span class="text-slate-600 text-sm">Sem capa</span>
            </div>
            <div class="col-span-2 space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">Título do Vídeo</label>
                <input type="text" id="vTitle" required class="w-full px-4 py-2 bg-[#060D17] border border-white/10 rounded-xl text-white text-sm focus:border-amber-400 outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">Descrição (SEO & Contexto)</label>
                <textarea id="vDesc" rows="3" class="w-full px-4 py-2 bg-[#060D17] border border-white/10 rounded-xl text-white text-sm focus:border-amber-400 outline-none"></textarea>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t border-white/10">
            <!-- BLOCO 2: MATERIAIS -->
            <div class="space-y-4 p-4 rounded-xl bg-white/5 border border-white/10">
              <h3 class="font-bold text-sm text-white flex items-center gap-2"><i data-lucide="folder-lock" class="w-4 h-4 text-emerald-400"></i> Arquivos Gated (Requer Login)</h3>
              <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">URL do PDF</label>
                <input type="url" id="vPdf" placeholder="https://..." class="w-full px-3 py-2 bg-[#060D17] border border-white/10 rounded-lg text-xs text-white">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">URL do Áudio (MP3)</label>
                <input type="url" id="vAudio" placeholder="https://..." class="w-full px-3 py-2 bg-[#060D17] border border-white/10 rounded-lg text-xs text-white">
              </div>
            </div>

            <!-- BLOCO 3: REFERÊNCIA CRUZADA -->
            <div class="space-y-4 p-4 rounded-xl bg-white/5 border border-white/10">
              <h3 class="font-bold text-sm text-white flex items-center gap-2"><i data-lucide="link" class="w-4 h-4 text-amber-400"></i> Vínculo Pedagógico (Ponte)</h3>
              <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">Curso Oficial</label>
                <select id="refCourse" onchange="loadModules()" class="w-full px-3 py-2 bg-[#060D17] border border-white/10 rounded-lg text-xs text-white"><option value="">Nenhum Vínculo</option></select>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-bold text-slate-400 mb-2">Módulo</label>
                  <select id="refModule" onchange="loadLessons()" disabled class="w-full px-3 py-2 bg-[#060D17] border border-white/10 rounded-lg text-xs text-white"><option value="">-</option></select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-400 mb-2">Aula</label>
                  <select id="refLesson" disabled class="w-full px-3 py-2 bg-[#060D17] border border-white/10 rounded-lg text-xs text-white"><option value="">-</option></select>
                </div>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between pt-6 border-t border-white/10">
            <div class="flex gap-6">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="vActive" checked class="w-4 h-4 accent-emerald-500 bg-[#060D17] border-white/20">
                <span class="text-sm font-bold">Ativo</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="vHome" class="w-4 h-4 accent-amber-500 bg-[#060D17] border-white/20">
                <span class="text-sm font-bold text-amber-400">Destacar na Home</span>
              </label>
              <label class="flex items-center gap-2">
                <span class="text-xs text-slate-400">Ordem na Home:</span>
                <input type="number" id="vHomeOrder" value="1" min="1" max="3" class="w-16 px-2 py-1 bg-[#060D17] border border-white/10 rounded text-xs text-center text-white">
              </label>
            </div>
            <button type="submit" id="btnSave" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition">
              Salvar Vídeo
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="assets/js/youtube-manager-lab.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
