<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta Especial | AgoraEuFalo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>

  <!-- Hotmart Widget Loader -->
  <script src="https://static.hotmart.com/checkout/widget.min.js"></script>
</head>
<body class="bg-[#060D17] text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-amber-500 selection:text-slate-950">

  <main class="w-full flex-1">
    <!-- Hero Section Cinemático -->
    <section class="relative pt-16 pb-20 sm:pt-24 sm:pb-32 overflow-hidden bg-gradient-to-b from-[#060D17] via-[#0A192F] to-[#060D17] text-white">
      <!-- Glow de Ambiente Âmbar -->
      <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-amber-500/10 pointer-events-none blur-3xl rounded-full"></div>

      <div class="max-w-4xl mx-auto px-4 sm:px-6 relative z-10 flex flex-col items-center text-center space-y-6">
        
        <!-- Badge Institucional (Opcional, mas dá o tom) -->
        <div class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-amber-500/10 border border-amber-400/30 text-amber-300 text-xs font-mono font-bold uppercase tracking-wider shadow-inner mb-2">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span>AgoraEuFalo • Oferta Oficial</span>
        </div>

        <h1 id="heroHeadline" class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-[1.15] text-white">
          Carregando Oferta...
        </h1>
        <p id="heroSubheadline" class="text-lg sm:text-xl text-slate-300 font-normal leading-relaxed max-w-2xl mx-auto">
          Aguarde um momento enquanto carregamos os detalhes da sua inscrição.
        </p>
        
        <div id="heroVideoContainer" class="w-full max-w-4xl aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl hidden mt-10 border-2 border-white/10 relative z-20">
          <iframe id="heroVideoFrame" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- Content Blocks (Dynamic Copy) -->
    <div id="contentBlocksContainerWrapper" class="flex flex-col space-y-16 py-8 sm:py-16 w-full max-w-4xl mx-auto px-4 sm:px-6">
       <!-- Rendered dynamically -->
    </div>

    <!-- Ofertas Section -->
    <section class="max-w-5xl mx-auto px-4 sm:px-6 py-16 sm:py-24">
      <div id="offersContainer" class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start justify-center">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <!-- Footer minimal -->
  <footer class="border-t border-white/5 py-8 text-center text-xs text-slate-500">
    <p>&copy; 2026 AgoraEuFalo. Todos os direitos reservados.</p>
  </footer>

  <script>
    const FIREBASE_PROJECT_ID = 'agoraeufalo-3463a';
    const FIREBASE_API_KEY = 'AIzaSyCdcFzySfxGK6Uo0DM1-y_HpACvt5E71Sk';

    let currentPageSlug = '';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentPageSlug = urlParams.get('p');
      
      if (!currentPageSlug) {
        document.getElementById('heroHeadline').innerText = 'Página Não Encontrada';
        document.getElementById('heroSubheadline').innerText = 'Verifique o link e tente novamente.';
        return;
      }

      await loadLandingPage(currentPageSlug);
    });

    async function loadLandingPage(slug) {
      try {
        const apiKey = FIREBASE_API_KEY ? `?key=${FIREBASE_API_KEY}` : '';
        const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/landing_pages/${slug}${apiKey}`;
        
        const res = await fetch(url);
        if (!res.ok) {
           document.getElementById('heroHeadline').innerText = 'Oferta não encontrada ou indisponível';
           document.getElementById('heroSubheadline').innerText = 'A oferta pode ter expirado.';
           return;
        }

        const doc = await res.json();
        const f = doc.fields || {};
        
        // Status check
        if (f.status?.stringValue !== 'published') {
           document.getElementById('heroHeadline').innerText = 'Oferta Indisponível';
           document.getElementById('heroSubheadline').innerText = 'Esta página ainda não foi publicada.';
           return;
        }

        // Fill Hero
        const hero = f.hero?.mapValue?.fields || {};
        document.title = f.title?.stringValue || 'Oferta Especial | AgoraEuFalo';
        document.getElementById('heroHeadline').innerText = hero.headline?.stringValue || 'Oferta Especial';
        document.getElementById('heroSubheadline').innerText = hero.subheadline?.stringValue || '';
        
        const ytId = hero.youtubeVideoId?.stringValue;
        if (ytId) {
           const vc = document.getElementById('heroVideoContainer');
           const vf = document.getElementById('heroVideoFrame');
           vf.src = `https://www.youtube.com/embed/${ytId}?rel=0`;
           vc.classList.remove('hidden');
        }

        // Parse and Render Content Blocks
        const contentBlocksRaw = (f.contentBlocks?.arrayValue?.values || []).map(v => {
           const mf = v.mapValue?.fields || {};
           const titleRaw = mf.title?.stringValue || '';
           const internalLabels = ['Texto Simples', 'Dor / Agitação', 'Benefícios', 'FAQ', 'Garantia', 'Sobre o Autor'];
           return {
              type: mf.type?.stringValue || 'text',
              title: internalLabels.includes(titleRaw) ? '' : titleRaw,
              content: mf.content?.stringValue || '',
              order: mf.order?.integerValue || 0
           };
        }).sort((a,b) => a.order - b.order);

        const blocksContainer = document.getElementById('contentBlocksContainerWrapper');
        if (contentBlocksRaw.length > 0) {
           let blocksHtml = '';
           for (const b of contentBlocksRaw) {
              if (b.type === 'text') {
                 blocksHtml += `
                   <div class="space-y-6 text-center max-w-3xl mx-auto py-8">
                     ${b.title ? `<h2 class="text-3xl sm:text-4xl font-black text-white leading-tight">${b.title}</h2>` : ''}
                     <div class="text-slate-300 text-lg sm:text-xl leading-relaxed space-y-6">${b.content.replace(/\n|\\n/g, '<br>')}</div>
                   </div>
                 `;
              } else if (b.type === 'pain_agitation') {
                 blocksHtml += `
                   <div class="relative bg-gradient-to-b from-rose-950/40 to-[#0A192F] border border-rose-500/20 rounded-3xl p-8 sm:p-14 text-center shadow-2xl overflow-hidden group">
                     <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-rose-500/10 blur-[100px] pointer-events-none transition duration-700 group-hover:bg-rose-500/20"></div>
                     <div class="flex justify-center mb-6">
                        <i data-lucide="quote" class="w-12 h-12 text-rose-500/40"></i>
                     </div>
                     ${b.title ? `<h2 class="text-3xl sm:text-4xl font-black text-rose-400 mb-8 leading-tight tracking-tight">${b.title}</h2>` : ''}
                     <div class="text-slate-200 text-xl sm:text-2xl leading-relaxed max-w-3xl mx-auto font-serif italic text-balance relative z-10">"${b.content.replace(/\n|\\n/g, '<br>')}"</div>
                   </div>
                 `;
              } else if (b.type === 'benefits') {
                 // Split benefits by newline to create a list
                 const items = b.content.split(/\n|\\n/).map(i => i.trim()).filter(Boolean);
                 const itemsHtml = items.map(item => `
                   <div class="flex items-start gap-4 p-4 rounded-2xl bg-white/5 hover:bg-white/10 transition border border-white/5">
                     <div class="mt-1 shrink-0 bg-emerald-500/20 p-2 rounded-full">
                       <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
                     </div>
                     <p class="text-slate-300 text-lg leading-relaxed">${item}</p>
                   </div>
                 `).join('');

                 blocksHtml += `
                   <div class="bg-[#112240] rounded-3xl p-8 sm:p-12 shadow-2xl border border-amber-500/10">
                     <div class="flex justify-center mb-6">
                        <i data-lucide="sparkles" class="w-10 h-10 text-amber-500"></i>
                     </div>
                     ${b.title ? `<h2 class="text-3xl sm:text-4xl font-black text-amber-400 text-center mb-10 leading-tight">${b.title}</h2>` : ''}
                     <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto">
                        ${itemsHtml || `<div class="text-slate-300 text-lg leading-relaxed col-span-full text-center space-y-4">${b.content.replace(/\n|\\n/g, '<br>')}</div>`}
                     </div>
                   </div>
                 `;
              } else if (b.type === 'faq') {
                 const qs = b.content.split(/\n\n|\\n\\n/).map(q => q.trim()).filter(Boolean);
                 const qsHtml = qs.map(q => `
                    <div class="flex gap-4 bg-white/5 border border-white/10 rounded-2xl p-6">
                       <i data-lucide="help-circle" class="w-6 h-6 shrink-0 text-amber-500 mt-1"></i>
                       <div class="text-slate-300 text-lg space-y-2">${q.replace(/\n|\\n/g, '<br>').replace(/P:/g, '<strong class="text-white">P:</strong>').replace(/R:/g, '<strong class="text-amber-400">R:</strong>')}</div>
                    </div>
                 `).join('');

                 blocksHtml += `
                   <div class="border-t border-white/10 pt-16">
                     ${b.title ? `<h2 class="text-3xl sm:text-4xl font-black text-white text-center mb-12">${b.title}</h2>` : ''}
                     <div class="space-y-8 max-w-3xl mx-auto">
                        ${qsHtml || `<div class="text-slate-300 text-lg leading-relaxed">${b.content.replace(/\n|\\n/g, '<br>')}</div>`}
                     </div>
                   </div>
                 `;
              } else if (b.type === 'guarantee') {
                 const gDaysMatch = (b.content || '').match(/(7|15|30)\s*dias?/i);
                 const gDays = gDaysMatch ? gDaysMatch[1] : '7';
                 const gContent = b.content || `Garantia Incondicional de ${gDays} Dias. Seu risco é absolutamente zero. Se você não gostar do método, devolvemos 100% do seu dinheiro, sem burocracia.`;
                 
                 blocksHtml += `
                   <div class="relative overflow-hidden flex flex-col sm:flex-row items-center gap-8 bg-gradient-to-r from-amber-500/10 to-[#0A192F] border border-amber-500/30 rounded-3xl p-8 sm:p-12 shadow-2xl group">
                     <div class="absolute right-0 top-0 w-64 h-64 bg-amber-500/10 rounded-full blur-[80px] -mr-20 -mt-20"></div>
                     
                     <div class="relative flex flex-col items-center justify-center w-24 h-24 shrink-0 bg-amber-500/20 rounded-full border-2 border-amber-500 text-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.5)] z-10">
                       <span class="text-4xl font-black">${gDays}</span>
                       <span class="absolute -bottom-3 bg-amber-500 text-slate-950 text-[11px] font-black uppercase px-3 py-1 rounded-full tracking-wider">DIAS</span>
                     </div>

                     <div class="relative z-10 text-center sm:text-left mt-4 sm:mt-0">
                       ${b.title ? `<h2 class="text-3xl font-black text-white mb-3">${b.title}</h2>` : ''}
                       <div class="text-slate-300 text-lg leading-relaxed max-w-xl">${gContent.replace(/\\n/g, '<br>')}</div>
                     </div>
                   </div>
                 `;
              } else if (b.type === 'about_leo') {
                 blocksHtml += `
                   <div class="flex flex-col sm:flex-row items-center gap-10 p-8 sm:p-14 bg-[#060D17] rounded-3xl border border-white/5 shadow-2xl relative overflow-hidden">
                     <div class="w-40 h-40 rounded-full bg-slate-800 shrink-0 overflow-hidden border-4 border-amber-500/50 shadow-[0_0_30px_rgba(245,158,11,0.2)] relative z-10">
                        <img src="/assets/images/leonardo-leite.png" alt="Professor Leonardo Leite" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=Leonardo+Leite&background=0D1B2A&color=F59E0B&size=200'">
                     </div>
                     <div class="relative z-10 text-center sm:text-left">
                       <h2 class="text-3xl font-black text-white mb-4">Professor Leonardo Leite</h2>
                       <p class="text-slate-400 text-lg leading-relaxed max-w-2xl">Mais de 35 anos de experiência em sala de aula e criador do ecossistema AgoraEuFalo. Especialista em destravar a fala do adulto brasileiro através do "Sentimento da Estrutura" — sem enrolação, sem jargões gramaticais, direto ao ponto.</p>
                     </div>
                   </div>
                 `;
              }
           }
           blocksContainer.innerHTML = blocksHtml;
           if (window.lucide) window.lucide.createIcons();
        } else {
           blocksContainer.classList.add('hidden');
        }

        // Load Offers
        const offerBlocks = (f.offerBlocks?.arrayValue?.values || []).map(v => v.mapValue?.fields?.offerId?.stringValue).filter(Boolean);
        
        if (offerBlocks.length > 0) {
           const offersContainer = document.getElementById('offersContainer');
           
           let activeCount = 0;
           let htmlBuffer = '';

           for (const offerId of offerBlocks) {
              const offerRes = await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/offers/${offerId}${apiKey}`);
              if (offerRes.ok) {
                 const offerDoc = await offerRes.json();
                 const ofF = offerDoc.fields || {};
                 
                 // If paused, skip or show as disabled (will skip for now)
                 if (ofF.status?.stringValue !== 'active') continue;

                 const title = ofF.title?.stringValue || 'Oferta';
                 const badge = ofF.badge?.stringValue || '';
                 const hmOffer = ofF.hotmart?.mapValue?.fields || {};
                 let checkoutUrl = hmOffer.checkoutUrl?.stringValue || '';
                 
                 // Add tracking SRC
                 if (checkoutUrl) {
                    try {
                       const u = new URL(checkoutUrl);
                       u.searchParams.set('src', `landing_${currentPageSlug}`);
                       checkoutUrl = u.toString();
                    } catch(e) {}
                 }
                 
                 const pricing = ofF.pricing?.mapValue?.fields || {};
                 const price = pricing.offerPrice?.doubleValue || pricing.offerPrice?.integerValue || 0;
                 const oldPrice = pricing.regularPrice?.doubleValue || pricing.regularPrice?.integerValue || 0;
                 const inst = pricing.installmentsText?.stringValue || '';

                 const stripeOffer = ofF.stripe?.mapValue?.fields || {};
                 const stripeUrl = stripeOffer.checkoutUrl?.stringValue || '';

                 // Render Card
                 let stripeHtml = '';
                 if (stripeUrl) {
                    stripeHtml = `
                      <div class="mt-4 text-center">
                        <a href="${stripeUrl}" target="_blank" class="text-[11px] text-slate-400 underline hover:text-white transition">
                          Pagar com cartão internacional (USD/EUR) via Stripe
                        </a>
                      </div>
                    `;
                 }

                 // If Hotmart URL exists, use JS Modal via openHotmartCheckout
                 let ctaHtml = '';
                 if (checkoutUrl && checkoutUrl !== '') {
                     ctaHtml = `
                       <button type="button" onclick="window.openHotmartCheckout('${checkoutUrl}')" class="w-full py-4 px-6 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs sm:text-sm uppercase tracking-wider transition-all shadow-lg shadow-amber-500/25 active:scale-95 flex items-center justify-center gap-2 cursor-pointer mt-4">
                          <span>Garantir Minha Vaga ➔</span>
                       </button>
                     `;
                 } else {
                     ctaHtml = `
                       <button type="button" disabled class="w-full py-4 px-6 rounded-xl bg-slate-800 text-slate-500 font-black text-xs sm:text-sm uppercase tracking-wider mt-4 cursor-not-allowed">
                          <span>Oferta Indisponível</span>
                       </button>
                     `;
                 }

                 const cardHtml = `
                    <div class="bg-[#112240] border border-amber-500/30 rounded-3xl p-6 sm:p-8 flex flex-col shadow-2xl relative">
                       ${badge ? `<div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 text-[10px] font-black uppercase px-3 py-1 rounded-full tracking-wider">${badge}</div>` : ''}
                       <h3 class="text-xl sm:text-2xl font-black text-white text-center mb-4 mt-2">${title}</h3>
                       
                       <div class="my-6 text-center">
                          ${oldPrice > price ? `<div class="text-sm text-slate-400 line-through mb-1">De R$ ${Number(oldPrice).toFixed(2).replace('.',',')}</div>` : ''}
                          <div class="text-3xl font-black text-amber-400">${inst || `R$ ${Number(price).toFixed(2).replace('.',',')}`}</div>
                       </div>
                       
                       ${ctaHtml}
                       ${stripeHtml}
                    </div>
                 `;
                 
                 activeCount++;
                 htmlBuffer += cardHtml;
              }
           }
           
           if (activeCount === 1) {
              offersContainer.className = 'grid grid-cols-1 gap-8 items-start justify-center max-w-md mx-auto';
           } else {
              offersContainer.className = 'grid grid-cols-1 md:grid-cols-2 gap-8 items-start justify-center';
           }
           offersContainer.innerHTML = htmlBuffer;
           
        } else {
           document.getElementById('offersContainer').innerHTML = '<p class="col-span-full text-center text-slate-400">Nenhuma oferta vinculada a esta página no momento.</p>';
        }

      } catch(e) {
        console.error('Error fetching landing page', e);
        document.getElementById('heroHeadline').innerText = 'Erro de Comunicação';
        document.getElementById('heroSubheadline').innerText = 'Tente recarregar a página.';
      }
    }

    // Expose openHotmartCheckout globally
    window.openHotmartCheckout = function(checkoutUrl) {
      if (!checkoutUrl) {
         alert('Link de checkout indisponível no momento.');
         return;
      }
      try {
         const url = new URL(checkoutUrl);
         // Inject tracking SRC
         url.searchParams.set('src', `landing_${currentPageSlug}`);
         
         if (window.HM && window.HM.checkout) {
            window.HM.checkout.open({ url: url.toString() });
         } else if (window.hotmart_widget) {
            hotmart_widget.open({ url: url.toString() });
         } else {
            window.open(url.toString(), '_blank');
         }
      } catch (e) {
         console.warn("Invalid URL", checkoutUrl);
         window.open(checkoutUrl, '_blank');
      }
    };
  </script>
</body>
</html>
