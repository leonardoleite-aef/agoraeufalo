<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta Gratuita | Portal AgoraEuFalo</title>
  <meta name="description" content="Crie sua conta gratuita no Portal AgoraEuFalo e libere masterclasses, apostilas em PDF e o Training Player com o Professor Leonardo Leite.">
  
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/aef-glassmorphism.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- AgoraEuFalo SDKs -->
  <script src="assets/js/aef-hotmart-send.js"></script>
  <script src="assets/js/aef-portal-auth.js"></script>
</head>
<body class="ambient-bg text-slate-800 min-h-full flex flex-col justify-between selection:bg-amber-100 selection:text-amber-900 font-sans antialiased p-4">

  <!-- Top Simple Header -->
  <header class="w-full max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2 group transition" title="Voltar ao início">
      <img src="assets/images/AEF-Logo_2026_fundo_escuro-800x300.png" alt="AgoraEuFalo" class="h-8 sm:h-9 object-contain filter invert opacity-90 hover:opacity-100 transition">
    </a>
    <a href="login.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-950 px-3 py-1.5 rounded-xl bg-white border border-slate-200 shadow-sm transition">
      <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
      <span>Já sou Aluno • Entrar</span>
    </a>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-md">
      
      <!-- Main Glass Card -->
      <div class="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden space-y-6">
        
        <!-- Header Titles -->
        <div class="text-center space-y-2">
          <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-extrabold uppercase tracking-wider border border-amber-200">
            <span>✨ CADASTRO GRATUITO EM 1 MINUTO</span>
          </div>
          <h1 class="text-2xl sm:text-3xl font-bold font-serif text-slate-900 tracking-tight">
            Comece a Falar Inglês Hoje
          </h1>
          <p class="text-slate-500 text-xs sm:text-sm leading-relaxed">
            Cadastre-se gratuitamente para acessar o portal e treinar o reflexo oral.
          </p>
        </div>

        <!-- Google One-Click Login -->
        <button onclick="handleGoogleSignUp()" class="w-full py-2.5 px-4 rounded-2xl bg-white hover:bg-slate-50 text-slate-900 font-bold text-xs sm:text-sm flex items-center justify-center gap-3 transition shadow-sm border border-slate-200 cursor-pointer active:scale-[0.99]">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Criar Conta com Google</span>
        </button>

        <!-- Divider -->
        <div class="relative flex items-center justify-center">
          <div class="border-t border-slate-200 w-full"></div>
          <span class="bg-white/80 px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">ou com seus dados</span>
        </div>

        <!-- Registration Form -->
        <form onsubmit="handleRegisterSubmit(event)" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Seu Nome Completo *</label>
            <input type="text" id="reg-name" required placeholder="ex: João Silva" class="w-full bg-white border border-slate-200 focus:border-amber-500 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-slate-900 placeholder-slate-400 outline-none transition font-sans shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Seu Melhor E-mail *</label>
            <input type="email" id="reg-email" required placeholder="seuemail@exemplo.com" class="w-full bg-white border border-slate-200 focus:border-amber-500 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-slate-900 placeholder-slate-400 outline-none transition font-sans shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">WhatsApp (com DDD) *</label>
            <input type="tel" id="reg-phone" required placeholder="(11) 99999-9999" class="w-full bg-white border border-slate-200 focus:border-amber-500 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-slate-900 placeholder-slate-400 outline-none transition font-sans shadow-sm">
          </div>

          <button type="submit" id="btn-submit-reg" class="w-full mt-2 py-2.5 px-4 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs sm:text-sm flex items-center justify-center gap-2 transition shadow-sm cursor-pointer active:scale-[0.99]">
            <span>Criar Minha Conta Gratuita</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <!-- Terms -->
        <p class="text-center text-[11px] text-slate-400 leading-tight">
          Ao se cadastrar, você concorda com nossos <a href="termos-de-uso.html" class="text-slate-600 font-bold hover:underline">Termos de Uso</a> e <a href="politica-de-privacidade.html" class="text-slate-600 font-bold hover:underline">Privacidade</a>.
        </p>

      </div>

    </div>
  </main>

  <footer class="w-full max-w-6xl mx-auto px-4 py-4 text-center text-xs text-slate-400 font-medium">
    <p>AgoraEuFalo © 2026 • Professor Leonardo Leite</p>
  </footer>

  <script>
    async function handleGoogleSignUp() {
      if (window.AEFPortalAuth) {
        await window.AEFPortalAuth.signInWithGoogle();
      } else {
        window.location.href = 'portal.html';
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();

      const btn = document.getElementById('btn-submit-reg');
      btn.innerHTML = '<span>Criando seu Acesso...</span> <span>⏳</span>';

      if (window.AEFHotmartSend) {
        await window.AEFHotmartSend.submitFreeLead(name, email, phone, 'cadastro_gratis_portal');
      }

      localStorage.setItem('aef_active_student', email.split('@')[0]);
      localStorage.setItem('aef_user_name', name);
      window.location.href = 'portal.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
